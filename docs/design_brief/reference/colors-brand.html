<!doctype html>
<html><head><meta charset="utf-8"><title>Brand colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--bg-page); display:grid; grid-template-columns:repeat(4,1fr); gap:12px; height:240px; box-sizing:border-box; }
  .sw { display:flex; flex-direction:column; justify-content:flex-end; padding:14px; border-radius:var(--radius-md); border:1px solid var(--border-1); height:100%; }
  .sw .name { font-family:var(--font-mono); font-size:11px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; }
  .sw .hex  { font-family:var(--font-mono); font-size:11px; opacity:.65; margin-top:2px; }
  .neutral-0 { background:var(--neutral-0); color:var(--neutral-8); }
  .neutral-2 { background:var(--neutral-2); color:var(--neutral-8); }
  .neutral-5 { background:var(--neutral-5); color:var(--neutral-0); }
  .neutral-8 { background:var(--neutral-8); color:var(--neutral-0); }
  .ember     { background:var(--accent-2); color:var(--neutral-0); }
  .ember-soft{ background:var(--accent-2-soft); color:var(--neutral-8); }
  .success   { background:var(--success); color:var(--neutral-0); }
  .danger    { background:var(--danger); color:var(--neutral-0); }
</style></head>
<body>
  <div class="sw neutral-0"><span class="name">Neutral 0</span><span class="hex">#FBF9F4 — paper</span></div>
  <div class="sw neutral-2"><span class="name">Neutral 2</span><span class="hex">#E8E2D4 — hairline</span></div>
  <div class="sw neutral-5"><span class="name">Neutral 5</span><span class="hex">#756E61 — secondary</span></div>
  <div class="sw neutral-8"><span class="name">Neutral 8</span><span class="hex">#1F1C18 — ink</span></div>
  <div class="sw ember"><span class="name">Ember</span><span class="hex">#C75A2C — accent</span></div>
  <div class="sw ember-soft"><span class="name">Ember soft</span><span class="hex">#FCEEE5</span></div>
  <div class="sw success"><span class="name">Success</span><span class="hex">#6B8F73 — sage</span></div>
  <div class="sw danger"><span class="name">Danger</span><span class="hex">#B05E4A — terracotta</span></div>
</body></html>
