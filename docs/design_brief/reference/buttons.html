<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:32px; background:var(--bg-page); display:flex; align-items:center; flex-wrap:wrap; gap:10px; height:200px; box-sizing:border-box; align-content:center; }
  .btn { font-family:var(--font-sans); font-size:13px; font-weight:500; padding:8px 14px; border-radius:var(--radius-sm); border:1px solid transparent; cursor:pointer; display:inline-flex; align-items:center; gap:8px; line-height:1.4; transition:background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); letter-spacing:-0.005em; }
  .primary { background:var(--neutral-8); color:var(--neutral-0); }
  .primary:hover { background:#26241F; }
  .secondary { background:var(--bg-surface); color:var(--fg-1); border-color:var(--border-2); }
  .secondary:hover { border-color:var(--neutral-7); }
  .ghost { background:transparent; color:var(--fg-2); }
  .ghost:hover { background:var(--neutral-1); color:var(--fg-1); }
  .ember { background:var(--accent-2); color:var(--neutral-0); }
  .ember:hover { background:#A94818; }
  .small { font-size:12px; padding:5px 10px; }
  .icon { width:14px; height:14px; }
  kbd { font-family:var(--font-mono); font-size:11px; padding:2px 5px; background:var(--neutral-1); border:1px solid var(--border-1); border-radius:4px; color:var(--fg-3); }
</style></head>
<body>
  <button class="btn primary">Continue<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <button class="btn secondary">Review gaps</button>
  <button class="btn ember">Start interview</button>
  <button class="btn ghost">Skip</button>
  <button class="btn secondary small">Save draft</button>
  <button class="btn primary"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Send <kbd>↵</kbd></button>
</body></html>
