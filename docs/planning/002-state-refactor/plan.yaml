          TEST_FILE="${TEST_FILE%.ts}.test.ts"

          if [ -f "$TEST_FILE" ]; then
            npm test "$TEST_FILE" -- --run || {
              echo "❌ FAILED: $TEST_FILE"
              exit 1
            }
          fi
        done

        echo "✅ All backward compatibility tests passed"
