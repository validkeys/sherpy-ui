  notes: |
    ## Key Architectural Decisions

    1. **XState Remains Central**: The 10-step Sherpy workflow IS a state machine.
       XState provides value for workflow orchestration, async coordination, and
       state-dependent behavior. We're not removing XState, we're refactoring what
       it owns.

    2. **Domain Layer is Pure**: All business logic lives in pure functions with
       zero side effects. This makes testing trivial and ensures business rules
       are isolated from infrastructure concerns.

    3. **Adapters Are Optional**: Only create adapters for complex transformations.
       Simple 1:1 mappings can be inline in components. This reduces over-engineering
       while maintaining clean separation when needed.

    4. **Gradual Migration**: We're not doing a big-bang rewrite. Legacy code is
       deprecated but not deleted. New code uses new architecture. Components migrate
       gradually.

    5. **Load → Transform → Persist Pattern**: Infrastructure layer follows consistent
       pattern: load state from DB → apply domain logic → persist new state. This
       makes code predictable and testable.

    6. **Type Safety First**: Use literal union types (StepNumber = 1 | 2 | ... | 10)
       instead of generic numbers. Catch errors at compile time, not runtime.

    7. **Observability Built-In**: All server functions log start/success/error events
       with timestamps and context. Makes debugging production issues tractable.

    8. **Incremental Validation**: Run `madge` after each phase to catch circular
       dependencies early. Run integration tests after Phase 3 to validate layer
       boundaries before building on top of them.

    ## Testing Strategy

    - **Domain Tests**: Fast, isolated, pure function tests. No mocks needed.
    - **Infrastructure Tests**: Integration tests with actual DB (use test fixtures).
    - **Workflow Tests**: XState machine tests using @xstate/test.
    - **Adapter Tests**: Pure transformation tests (input → output), only if adapter created.
    - **Integration Tests**: Layer boundary tests validate domain → infrastructure → workflow.
    - **Performance Tests**: Benchmarks ensure no regression >10%.
    - **Data Migration Tests**: Validate existing DB data compatible with new types.
    - **E2E Tests**: Existing E2E tests validate full workflow still works.

    ## Performance Considerations

    - Domain functions are pure → fast, no I/O (target: <1ms)
    - Adapters are simple transformations → negligible overhead
    - Infrastructure layer doesn't add extra DB calls (just reorganizes existing ones)
    - React Query handles caching (no performance regression)
    - Benchmark after Phase 4 to validate assumptions

    ## Rollback Strategy

    - Each phase merged to main only after validation passes
    - Git tags at phase completion: v2.0.0-phase1, v2.0.0-phase2, etc.
    - If catastrophic failure: `git revert` to last stable tag
    - If single task fails: revert that file, re-plan task, retry

    ## Future Extensions

    - Add new workflow step: extend domain, add machine state, optionally create adapter
    - Add new UI component: create adapter only if transformation is complex
    - Swap persistence layer: modify infrastructure, domain unchanged
    - Add validation rules: add to domain layer, infrastructure calls them
    - Add observability: extend logServerAction in server-functions.ts
