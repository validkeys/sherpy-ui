version: "1.0.0"
project: Sherpy Mini-App - Planning Workflow
generated: "2026-05-12"
purpose: Manual acceptance testing for complete 10-step planning workflow

instructions:
  overview: |
    This test plan covers the complete planning workflow from project creation
    through all 10 planning steps. Each test case includes detailed acceptance
    criteria and expected behavior.

  execution_order: |
    Tests must be executed in order (TC-001 through TC-012) as each test
    depends on the previous test completing successfully.

  bug_reporting: |
    When a test fails:
    1. Update the status field to "FAILED"
    2. Document the failure in the notes field
    3. Create a GitHub issue with:
       - Title: "BUG: [Test Case ID] - Brief description"
       - Labels: bug, acceptance-testing
       - Body template:
         ## Test Case
         **ID:** [Test Case ID]
         **Step:** [Step name]

         ## Expected Behavior
         [Copy from acceptance criteria]

         ## Actual Behavior
         [Describe what happened]

         ## Steps to Reproduce
         1. [List steps]

         ## Environment
         - URL: http://localhost:5180
         - Browser: [Chrome/Firefox/Safari]
         - Date: [Date tested]

         ## Screenshots
         [Attach relevant screenshots]

         ## Additional Context
         [Any other relevant information]
    4. Link the GitHub issue URL in the github_issue field

  status_values:
    - "NOT_STARTED": Test not yet executed
    - "IN_PROGRESS": Test currently being executed
    - "PASSED": All acceptance criteria met
    - "FAILED": One or more acceptance criteria not met
    - "BLOCKED": Cannot execute due to dependency failure
    - "SKIPPED": Intentionally not executed

environment:
  url: http://localhost:5180
  server: Vite dev server
  required_services:
    - AWS Bedrock (Claude Sonnet)
    - In-memory project storage
    - In-memory artifact storage

test_cases:
  - id: TC-001
    name: Dashboard Load and Navigation
    category: Pre-workflow
    priority: Critical
    estimated_duration: 2 minutes
    status: NOT_STARTED

    prerequisites:
      - Dev server running on port 5180
      - No prior test data required

    test_steps:
      - step: 1
        action: Navigate to http://localhost:5180
        expected: Dashboard page loads successfully
      - step: 2
        action: Verify page elements are visible
        expected: All UI components render correctly

    acceptance_criteria:
      page_load:
        - criterion: Page loads within 2 seconds
          validation: Visual confirmation
        - criterion: No console errors in browser DevTools
          validation: Check browser console (F12)
        - criterion: Page title is visible
          validation: Title "Sherpy" or app name displayed

      ui_components:
        - criterion: "New project" button is visible
          validation: Button present in UI
        - criterion: Project list is visible (may be empty or have projects)
          validation: List container rendered
        - criterion: "Active" and "Past" tabs are visible
          validation: Tab buttons present
        - criterion: Left navigation rail is visible
          validation: Sidebar with navigation present

      functionality:
        - criterion: Can switch between Active/Past tabs
          validation: Click each tab, verify tab selection changes
        - criterion: Existing projects (if any) display name, code, step, and date
          validation: Check project card content

    notes: ""
    github_issue: ""

  - id: TC-002
