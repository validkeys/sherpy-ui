    category: Pre-workflow
    priority: Critical
    estimated_duration: 3 minutes
    status: NOT_STARTED

    prerequisites:
      - TC-001 passed
      - Dashboard is loaded

    test_steps:
      - step: 1
        action: Click "New project" button
        expected: Modal dialog appears with two options
      - step: 2
        action: Verify modal content
        expected: "Start from scratch" and "Start with a doc" options visible
      - step: 3
        action: Click "Start from scratch"
        expected: Project name form appears
      - step: 4
        action: Enter project name "Acceptance Test Project"
        expected: Text appears in input field
      - step: 5
        action: Click "Create project" button
        expected: Navigate to /project/{projectId}/build

    acceptance_criteria:
      modal_appearance:
        - criterion: Modal appears within 500ms of clicking "New project"
          validation: Visual confirmation of modal overlay
        - criterion: Modal has title or header
          validation: Check for modal title text
        - criterion: Modal backdrop dims the background
          validation: Background is darkened/overlayed
        - criterion: Modal has "Cancel" or close button
          validation: X button or Cancel button visible

      option_selection:
        - criterion: "Start from scratch" option is clickable
          validation: Button/card responds to click
        - criterion: "Start with a doc" option is visible but not used
          validation: Second option present in UI
        - criterion: Options have descriptive text explaining each path
          validation: Read description under each option

      project_name_form:
        - criterion: Form appears after selecting "Start from scratch"
          validation: Input field for project name visible
        - criterion: Input field accepts text input
          validation: Type text, verify it appears
        - criterion: "Create project" button is disabled when field is empty
          validation: Click button, verify no action
        - criterion: "Create project" button enables when name is entered
          validation: Button becomes clickable after typing
        - criterion: Form has "Back" button to return to option selection
          validation: Back button visible

      navigation:
        - criterion: After creation, URL changes to /project/{projectId}/build
          validation: Check browser address bar
        - criterion: Project ID is a valid short code (e.g., "5Zq8I0tC")
          validation: Verify ID format in URL
        - criterion: Page navigation completes within 2 seconds
