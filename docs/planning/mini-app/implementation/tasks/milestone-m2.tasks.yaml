milestone: m2
name: Project Page — Build Mode
generated: "2026-05-05"

style_anchors:
  - path: src/components/thread/ThreadView.tsx
    description: |
      The primary interview UI container. Build mode renders inside this
      component. Props: divider, question, options, composer, askbackMessages.
      Do not restructure — wire real data to existing prop interface.
  - path: src/components/spectrum-stepper/SpectrumStepper.tsx
    description: |
      Botanical-colored step indicator. stages[] array drives rendering.
      Status: 'complete' | 'now' | 'pending'. Wire to real step state.
  - path: src/components/thread/QuestionCard.tsx
    description: |
      Renders the AI question with question number n and text. Used as the
      `question` prop of ThreadView. Shape: { n: number, text: string }.

global_constraints:
  allowed_patterns:
    - "ONLY createServerFn for step state persistence"
    - "ONLY TanStack Query for client state"
    - "ONLY TanStack Router for navigation and params"
    - "ONLY Tailwind semantic tokens — no inline styles"
    - "Mock question content is fine for M2 — AI wired in M4"
  forbidden_patterns:
    - "No useState for step data — server fn is source of truth"
    - "No direct DOM manipulation"
    - "No new component libraries"
  tdd_required: true
  max_task_duration_minutes: 90
  commit_strategy: "Commit after each task"
  drift_policy:
    stop_criteria:
      - Introduces dependency not listed in allowed_patterns
      - Edits touch >3 files not in this task's files section
      - Lint or type errors introduced that cannot be resolved within task scope
      - Test fails and model proposes modifying the test instead of fixing implementation
    on_detect: |
      STOP immediately. Do not continue editing.
      Summarize: (1) what you intended, (2) what you found, (3) which files were touched.
      Revert: git checkout -- .
      Create incident note: docs/drift-incidents/YYYY-MM-DD-<task-id>.md
    allowed_deviations:
      - Whitespace-only edits
      - Single-line refactor within targeted file if type-checked and in-scope

quality_gates:
  - stage: pre-commit
    commands:
      - "pnpm biome check --write ."
      - "pnpm tsc --noEmit"
      - "pnpm test --run"
  - stage: task-completion
    criteria:
      - All tests passing
      - No TypeScript errors
      - Feature works end-to-end in browser

tasks:
  - id: m2-001
    status: complete
    completed: "2026-05-06"
    name: Step types and in-memory step store
    description: |
      TypeScript types for planning steps, answers, and the per-project
      step state. In-memory store keyed by projectId.
    estimate_minutes: 45
    type: code
    dependencies: []
    files:
      create:
        - src/features/planning/types.ts
        - src/features/planning/store.ts
        - src/features/planning/store.test.ts
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Step state tracks which planning step a project is on, what answers
      have been given, and the mock question for each step.

      **Implementation Steps:**
      1. `src/features/planning/types.ts`:
         ```typescript
         export type StepStatus = 'complete' | 'now' | 'pending'

         export interface StepAnswer {
           value: string      // freeform text or option letter
           submittedAt: string
         }

         export interface PlanningStep {
           stepNumber: number  // 1-10
           name: string
           status: StepStatus
           question: string    // mock question text — replaced by AI in M4
           options?: Array<{ letter: string; title: string; body: string; recommended?: boolean }>
           answer?: StepAnswer
           artifactKey?: string // set after AI generates artifact in M4
         }

         export interface ProjectStepState {
           projectId: string
           currentStep: number   // 1-10
           steps: PlanningStep[]
         }
         ```
      2. `src/features/planning/store.ts`:
         - Map<projectId, ProjectStepState>
         - `initProjectSteps(projectId, entryPath)` — creates 10 steps with
           mock questions; step 1 is 'now', rest are 'pending'. If entryPath
           is 'doc-first', step 1 (Gap Analysis) starts pre-seeded.
         - `getStepState(projectId)` — returns state or throws
         - `submitAnswer(projectId, stepNumber, answer)` — saves answer,
           marks step complete, advances currentStep, sets next step to 'now'
         - `getStep(projectId, stepNumber)` — returns single step
      3. Mock question content for all 10 Sherpy planning steps (use the
         actual step names from business-requirements.yaml).

      **TDD Checklist:**
      - [ ] Test: initProjectSteps creates 10 steps, step 1 is 'now'
      - [ ] Test: submitAnswer marks step complete and advances currentStep
      - [ ] Test: submitAnswer on final step keeps currentStep at 10

    validation:
      commands:
        - "pnpm tsc --noEmit"
        - "pnpm test --run src/features/planning/store.test.ts"
      expected_output: tsc clean, all step store tests pass
      on_failure: Verify step numbering is 1-based; check Map initialization

  - id: m2-002
    status: complete
    completed: "2026-05-06"
    name: Planning server functions
    description: |
      createServerFn wrappers: getStepState, submitAnswer, getStep.
      Called from client via TanStack Query hooks.
    estimate_minutes: 60
    type: code
    dependencies: [m2-001]
    files:
      create:
        - src/features/planning/server.ts
        - src/features/planning/server.test.ts
        - src/features/planning/hooks.ts
      modify: []
      touch_only:
        - src/features/planning/store.ts
        - src/features/projects/store.ts
    instructions: |
      **Objective:**
      Server fns for step state. Also initialize step state when a project
      is first loaded if it hasn't been initialized yet (lazy init pattern).

      **Implementation Steps:**
      1. `src/features/planning/server.ts`:
         ```typescript
         export const $getStepState = createServerFn({ method: 'GET' })
           .validator((d: unknown) => {
             if (typeof d !== 'object' || d === null) throw new Error('invalid input')
             const input = d as Record<string, unknown>
             if (typeof input.projectId !== 'string' || !input.projectId)
               throw new Error('projectId required')
             return { projectId: input.projectId }
           })
           .handler(({ data }) => {
             // Lazy-init if not yet initialized
             if (!hasStepState(data.projectId)) {
               const project = getProject(data.projectId) // from projects store
               if (!project) throw new Error('Project not found')
               initProjectSteps(data.projectId, project.entryPath)
             }
             return getStepState(data.projectId)
           })

         export const $submitAnswer = createServerFn({ method: 'POST' })
           .validator((d: unknown) => {
             if (typeof d !== 'object' || d === null) throw new Error('invalid input')
             const input = d as Record<string, unknown>
             if (typeof input.projectId !== 'string' || !input.projectId)
               throw new Error('projectId required')
             if (typeof input.stepNumber !== 'number')
               throw new Error('stepNumber must be a number')
             if (typeof input.answer !== 'string' || !input.answer.trim())
               throw new Error('answer required')
             return {
               projectId: input.projectId,
               stepNumber: input.stepNumber,
               answer: input.answer.trim(),
             }
           })
           .handler(({ data }) => submitAnswer(
             data.projectId, data.stepNumber, data.answer
           ))
         ```
      2. `src/features/planning/hooks.ts`:
         - `useStepState(projectId)` → useQuery
         - `useSubmitAnswer()` → useMutation, invalidates step state query

      **TDD Checklist:**
      - [ ] Test: $getStepState lazy-inits and returns 10 steps
      - [ ] Test: $submitAnswer advances step and returns updated state
      - [ ] Test: $submitAnswer on unknown projectId throws

    validation:
      commands:
        - "pnpm tsc --noEmit"
        - "pnpm test --run src/features/planning/server.test.ts"
      expected_output: tsc clean, all planning server tests pass
      on_failure: Check cross-feature store imports; verify createServerFn validator shape

