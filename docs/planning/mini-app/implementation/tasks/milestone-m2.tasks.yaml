      2. In `$projectId.build.tsx`:
         ```tsx
         const showIntake = stepState.currentStep === 1 && !stepState.steps[0].answer
         return showIntake ? <ProjectIntake /> : <InterviewThread stepState={stepState} />
         ```

      **TDD Checklist:**
