  - id: m4-008
    name: Code review — M4 AI Integration
    description: |
      Full code review of all M4 work. Focus on security, streaming
      correctness, error handling, and environment variable discipline.
    estimate_minutes: 60
    type: code-review
    dependencies: [m4-001, m4-002, m4-003, m4-004, m4-005, m4-006, m4-007, m4-009, m4-010]
    files:
      create:
        - code-reviews/2026-05-05-5-code-review.yaml
      modify: []
      touch_only:
        - src/features/ai/
        - src/features/auth/
        - src/features/artifacts/
        - src/lib/bedrock.ts
        - app/api/
    instructions: |
      **Review Checklist:**
      1. **Security:**
         - [ ] No AWS credentials in source — only env vars and default credential chain
         - [ ] No model ID hardcoded in source
         - [ ] Bedrock API errors caught and returned as safe error messages
         - [ ] User input not injected into prompts without sanitization
         - [ ] All server fn validators use runtime type checks (no `data as Type` assertions)
      2. **Streaming:**
         - [ ] Stream cleanup (cancelled flag) prevents state updates after unmount
         - [ ] Content-Type: text/event-stream set on streaming response
         - [ ] Client reader released on completion
      3. **Auth:**
         - [ ] Session shape matches Okta OIDC token structure
         - [ ] AuthProvider wraps all routes requiring session
      4. **Error Handling:**
         - [ ] Bedrock rate-limit errors surfaced to UI as friendly message
         - [ ] Network errors during streaming handled gracefully
      5. **Artifact Generation:**
         - [ ] Artifact stored before $submitAnswer returns
         - [ ] Duplicate artifact keys overwrite (upsert) correctly
      6. **Artifact Editing:**
         - [ ] $updateArtifact throws on unknown key (no silent create)
         - [ ] Edit → Cancel discards changes (no mutation called)
         - [ ] Edit and Refine buttons disabled while save/refine is in flight
      7. **AI Refinement:**
         - [ ] $refineArtifact validates instruction is non-empty
         - [ ] buildRefinementPrompt keeps artifact content separate from instruction
         - [ ] Refined content overwrites existing artifact (not duplicated)

    validation:
      commands:
        - "pnpm tsc --noEmit"
        - "pnpm biome check ."
        - "pnpm test --run"
      expected_output: All quality gates pass
      on_failure: Document and fix before starting M5
