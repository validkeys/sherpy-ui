milestone: m4
name: AI Integration — Bedrock Streaming
generated: "2026-05-05"

style_anchors:
  - path: src/features/planning/server.ts
    description: |
      Pattern for createServerFn. AI server fns follow the same validator +
      handler structure. Streaming fn is the exception — it returns a
      ReadableStream from the handler instead of a plain value.
  - path: src/features/planning/components/InterviewThread.tsx
    description: |
      The component that receives AI-generated question text. In M4 it must
      handle a streaming string — render tokens as they arrive.

global_constraints:
  allowed_patterns:
    - "ONLY @aws-sdk/client-bedrock-runtime for Bedrock calls"
    - "ONLY InvokeModelWithResponseStream for AI streaming"
    - "ONLY environment variables for model ID, region, and AWS config"
    - "Model ID: us.anthropic.claude-sonnet-4-5-20250929-v1:0"
    - "ONLY createServerFn for non-streaming server-side AI logic; streaming uses Nitro API routes (app/api/) returning Response with ReadableStream body"
    - "ONLY TanStack Query for non-streaming client state"
    - "Streaming: use fetch + ReadableStream directly on the client for SSE"
  forbidden_patterns:
    - "No hardcoded model IDs in source — always from env vars"
    - "No hardcoded AWS credentials — use AWS profile/SSO locally, IRSA in prod"
    - "No AI SDK abstractions (LangChain, Vercel AI SDK, etc.) — AWS SDK v3 only"
    - "No streaming via WebSocket — use HTTP streaming"
  tdd_required: true
  max_task_duration_minutes: 90
  commit_strategy: "Commit after each task"
  drift_policy:
    stop_criteria:
      - Introduces dependency not listed in allowed_patterns
      - Edits touch >3 files not in this task's files section
      - Lint or type errors introduced that cannot be resolved within task scope
      - Test fails and model proposes modifying the test instead of fixing implementation
    on_detect: |
      STOP immediately. Do not continue editing.
      Summarize: (1) what you intended, (2) what you found, (3) which files were touched.
      Revert: git checkout -- .
      Create incident note: docs/drift-incidents/YYYY-MM-DD-<task-id>.md
    allowed_deviations:
      - Whitespace-only edits
      - Single-line refactor within targeted file if type-checked and in-scope

quality_gates:
  - stage: pre-commit
    commands:
      - "pnpm biome check --write ."
      - "pnpm tsc --noEmit"
      - "pnpm test --run"
  - stage: task-completion
    criteria:
      - No TypeScript errors
      - Biome passes
      - AI streaming visible in browser (tokens appear progressively)

tasks:
  - id: m4-001
    name: AWS Bedrock setup and environment configuration
    description: |
      Install AWS SDK v3 Bedrock runtime package. Document all required
      environment variables. Verify AWS credential chain works locally.
    estimate_minutes: 45
    type: config
    dependencies: []
    files:
      create:
        - .env.example
        - src/lib/bedrock.ts
      modify:
        - package.json
      touch_only: []
    instructions: |
      **Objective:**
      Establish the Bedrock client as a shared singleton. Environment
      variables are the only configuration surface — no hardcoded values.

      **Implementation Steps:**
      1. Install: `pnpm add @aws-sdk/client-bedrock-runtime`
      2. Create `.env.example`:
         ```
         # AWS Bedrock
         AWS_REGION=us-east-1
         BEDROCK_MODEL_ID=us.anthropic.claude-sonnet-4-5-20250929-v1:0

         # App
         PORT=3000
         SEED_DATA=true
         ```
      3. `src/lib/bedrock.ts`:
         ```typescript
         import { BedrockRuntimeClient } from '@aws-sdk/client-bedrock-runtime'

         // Singleton — module-level, shared across server fn invocations
         export const bedrockClient = new BedrockRuntimeClient({
           region: process.env.AWS_REGION ?? 'us-east-1',
         })

         export const BEDROCK_MODEL_ID =
           process.env.BEDROCK_MODEL_ID ??
           'us.anthropic.claude-sonnet-4-5-20250929-v1:0'
         ```
      4. Do NOT add dotenv — TanStack Start / Vinxi reads .env automatically.

    validation:
      commands:
        - "pnpm tsc --noEmit"
        - "node -e \"require('@aws-sdk/client-bedrock-runtime')\" && echo OK"
      expected_output: tsc clean; AWS SDK imports without error
      on_failure: Check AWS SDK version compatibility with Node.js version

