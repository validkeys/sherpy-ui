        - "pnpm biome check ."
      expected_output: tsc clean, Biome clean, shell renders in browser
      on_failure: Check browser console for runtime errors; verify ThemeProvider wraps root

  - id: m0-008
    name: Code review — M0 migration
    description: |
      Review all ported files for correctness, missing imports, and
      Storybook residue. Verify design token fidelity against _ref/.
    estimate_minutes: 60
    type: code-review
    dependencies: [m0-001, m0-002, m0-003, m0-004, m0-005, m0-006a, m0-006b, m0-006c, m0-007]
    files:
      create:
        - code-reviews/2026-05-05-1-code-review.yaml
      modify: []
      touch_only:
        - src/
        - app/
        - _ref/src/styles/tokens.css
    instructions: |
      **Objective:**
      Verify the migration is complete and faithful. Every component that
      existed in _ref/ must be present and compile-clean in src/.

      **Review Checklist:**
      1. **Style Token Fidelity:**
         - [ ] tokens.css is byte-for-byte identical to _ref/ version
         - [ ] index.css @theme inline block is intact
         - [ ] Dark mode @custom-variant present
      2. **Component Completeness:**
         - [ ] All components from _ref/src/components/ are present in src/components/
         - [ ] No *.stories.tsx files in src/
         - [ ] No fixtures.ts imports in running components
      3. **TypeScript:**
         - [ ] tsc --noEmit passes with zero errors
         - [ ] No `any` type assertions introduced during porting
      4. **Biome:**
         - [ ] biome check . passes with zero errors
      5. **Runtime:**
         - [ ] pnpm dev starts without errors
         - [ ] Shell renders in browser (visual check documented)

      **Output Format:** See milestone-m0 skill instructions for YAML format.

    validation:
      commands:
        - "pnpm tsc --noEmit"
        - "pnpm biome check ."
      expected_output: All quality gates pass
      on_failure: Document failures in review; do not proceed to M1 until resolved
