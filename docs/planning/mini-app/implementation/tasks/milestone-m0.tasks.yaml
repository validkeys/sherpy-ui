        - src/components/app-shell/AppShell.tsx
        - src/components/app-shell/index.ts
        - src/components/header/Header.tsx
        - src/components/header/index.ts
        - src/components/left-rail/LeftRail.tsx
        - src/components/left-rail/index.ts
        - src/components/mode-toggle/ModeToggle.tsx
        - src/components/mode-toggle/index.ts
        - src/components/spectrum-stepper/SpectrumStepper.tsx
        - src/components/spectrum-stepper/index.ts
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Port the structural shell components. Copy verbatim from _ref/.
      These files will be wired to real data in M1–M3; for now they
      use the same hardcoded demo props as the original.

      **Implementation Steps:**
      1. Copy these files verbatim from _ref/src/ to src/:
         - components/app-shell/AppShell.tsx + index.ts
         - components/header/Header.tsx + index.ts
         - components/left-rail/LeftRail.tsx + index.ts
         - components/mode-toggle/ModeToggle.tsx + index.ts
         - components/spectrum-stepper/SpectrumStepper.tsx + index.ts
      2. Fix any import paths that reference Storybook or test fixtures —
         replace with direct imports or remove if unused.
      3. Run `pnpm tsc --noEmit` — must be clean.

    validation:
