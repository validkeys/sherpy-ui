    type: code
    dependencies: [m0-003]
    files:
      create:
        - src/lib/utils.ts
        - src/components/ui/button.tsx
        - src/components/ui/button-variants.ts
        - src/components/ui/badge.tsx
        - src/components/ui/badge-variants.ts
        - src/components/ui/card.tsx
        - src/components/theme-provider/ThemeProvider.tsx
        - src/components/theme-provider/ThemeToggle.tsx
        - src/components/theme-provider/theme-context.ts
        - src/components/theme-provider/index.ts
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Re-establish the primitive component layer. Copy verbatim from _ref/.
      Do not refactor or rename anything — exact copies only.

      **Implementation Steps:**
      1. Install peer dependencies:
         ```bash
         pnpm add @base-ui/react class-variance-authority clsx \
           tailwind-merge lucide-react
         ```
      2. Copy these files verbatim from _ref/src/ to src/:
         - lib/utils.ts
         - components/ui/button.tsx
         - components/ui/button-variants.ts
         - components/ui/badge.tsx
         - components/ui/badge-variants.ts
         - components/ui/card.tsx
         - components/theme-provider/ThemeProvider.tsx
         - components/theme-provider/ThemeToggle.tsx
         - components/theme-provider/theme-context.ts
         - components/theme-provider/index.ts
      3. Update all @/ path aliases — they should resolve correctly since
         tsconfig.json maps @/ → ./src/.
      4. Run `pnpm tsc --noEmit` — all files must compile clean.

    validation:
      commands:
        - "pnpm tsc --noEmit"
        - "ls src/components/ui/button.tsx src/lib/utils.ts"
      expected_output: tsc clean, files exist
      on_failure: Check @/ alias in tsconfig.json; verify import paths in copied files

  - id: m0-005
    name: Port layout and shell components
    description: |
      Copy AppShell, Header, LeftRail, ModeToggle, and SpectrumStepper from
