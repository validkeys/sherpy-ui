milestone: m0
name: Repo Migration & TanStack Start Scaffold
generated: "2026-05-05"

style_anchors:
  - path: _ref/src/components/ui/card.tsx
    description: |
      Canonical card component pattern: cn() + data-slot attributes +
      Tailwind semantic tokens (bg-surface, border-border-1, text-fg-2).
      All ported components must follow this pattern exactly.
  - path: _ref/src/styles/tokens.css
    description: |
      Full design-token source of truth. Must be copied verbatim into
      src/styles/tokens.css in the new project. Do not alter variable names.
  - path: _ref/src/index.css
    description: |
      Tailwind v4 @theme inline block that maps tokens to utility classes.
      Must be copied verbatim. The @custom-variant dark rule is required.

global_constraints:
  allowed_patterns:
    - "ONLY pnpm as package manager"
    - "ONLY Biome for lint and format (no ESLint, no Prettier)"
    - "ONLY TanStack Start (Router + Vinxi + Nitro) — no Vite SPA config"
    - "ONLY Tailwind v4 with @theme inline — no tailwind.config.js"
    - "ONLY TypeScript strict mode"
    - "Copy components verbatim from _ref/ — no rewrites during migration"
  forbidden_patterns:
    - "Do not create any tailwind.config.js or tailwind.config.ts"
    - "Do not use ESLint or Prettier — Biome only"
    - "Do not modify component logic while porting — port first, fix later"
    - "Do not add new features in M0 — migration only"
  tdd_required: false
  max_task_duration_minutes: 90
  commit_strategy: "Commit after each task with conventional commit message"
  drift_policy:
    stop_criteria:
      - Introduces dependency not listed in allowed_patterns
      - Edits touch >3 files not in this task's files section
      - Lint or type errors introduced that cannot be resolved within task scope
      - Test fails and model proposes modifying the test instead of fixing implementation
    on_detect: |
      STOP immediately. Do not continue editing.
      Summarize: (1) what you intended, (2) what you found, (3) which files were touched.
      Revert: git checkout -- .
      Create incident note: docs/drift-incidents/YYYY-MM-DD-<task-id>.md
    allowed_deviations:
      - Whitespace-only edits
      - Single-line refactor within targeted file if type-checked and in-scope

quality_gates:
  - stage: pre-commit
    commands:
      - "pnpm biome check --write ."
      - "pnpm tsc --noEmit"
  - stage: task-completion
    criteria:
      - No TypeScript errors
      - Biome lint passes
      - Dev server starts without errors

tasks:
  - id: m0-001
    name: Copy repo to _ref/ and clean workspace
    description: |
      Preserve the entire existing Vite/Storybook project as a read-only
      reference at _ref/. Then remove Vite/Storybook config and source files
      from the workspace root to make room for TanStack Start.
    estimate_minutes: 30
    type: config
    dependencies: []
    files:
      create:
        - _ref/  # entire current project copied here
      modify:
        - .gitignore
      touch_only: []
    instructions: |
      **Objective:**
      Create a clean slate for TanStack Start while keeping the original
      code accessible at _ref/ for component porting in later tasks.

      **Implementation Steps:**
      1. Copy the entire workspace into _ref/:
         ```bash
         mkdir _ref
         cp -r src _ref/src
         cp -r public _ref/public
         cp package.json _ref/package.json
         cp pnpm-lock.yaml _ref/pnpm-lock.yaml
         cp tsconfig*.json _ref/
         cp vite.config.ts _ref/
         cp index.html _ref/
         cp eslint.config.js _ref/ 2>/dev/null || true
         cp components.json _ref/ 2>/dev/null || true
         ```
      2. Add _ref/ to .gitignore — it is reference-only and not tracked.
      3. Do NOT delete anything yet — that happens in m0-002 after scaffold.
      4. Commit with message: `chore: copy vite project to _ref/ for reference`

    validation:
      commands:
        - "ls _ref/src/components/ui/button.tsx"
        - "ls _ref/src/styles/tokens.css"
      expected_output: Both files exist in _ref/
      on_failure: Re-run copy commands, verify source paths

  - id: m0-002
    name: Scaffold TanStack Start project
    description: |
      Initialize a fresh TanStack Start project in the workspace root.
      Configure TypeScript strict mode, install core dependencies, and
      replace ESLint with Biome.
    estimate_minutes: 90
    type: config
    dependencies: [m0-001]
    files:
      create:
        - app.config.ts
        - app/root.tsx
        - app/routes/__root.tsx
        - app/routes/index.tsx
        - tsconfig.json
        - biome.json
        - package.json
        - vitest.config.ts
        - src/test-setup.ts
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Install TanStack Start and configure the project foundation.
      Biome replaces ESLint+Prettier. TypeScript in strict mode.

      **Implementation Steps:**
      1. Remove old Vite/Storybook files from workspace root:
         ```bash
         rm -f vite.config.ts index.html eslint.config.js
         rm -rf .storybook storybook-static dist
         rm -rf src/  # will be recreated in m0-003+
         ```
      2. Install TanStack Start and core deps:
         ```bash
         pnpm add @tanstack/start @tanstack/react-router \
           @tanstack/react-query react react-dom
         pnpm add -D typescript @types/react @types/react-dom \
           @biomejs/biome vite vinxi \
           vitest @vitest/coverage-v8 jsdom \
           @vitejs/plugin-react \
           @testing-library/react @testing-library/jest-dom @testing-library/user-event
         ```
      3. Create `app.config.ts`:
         ```typescript
         import { defineConfig } from '@tanstack/start/config'
         export default defineConfig({
           server: { preset: 'node-server' },
         })
         ```
      4. Create `tsconfig.json` with strict mode:
         ```json
         {
           "compilerOptions": {
             "strict": true,
             "target": "ES2022",
             "lib": ["ES2022", "DOM", "DOM.Iterable"],
             "module": "ESNext",
             "moduleResolution": "Bundler",
             "jsx": "react-jsx",
             "baseUrl": ".",
             "paths": { "@/*": ["./src/*"] },
             "skipLibCheck": true
           }
         }
         ```
      5. Create `biome.json`:
         ```json
         {
           "$schema": "https://biomejs.dev/schemas/1.9.4/schema.json",
           "organizeImports": { "enabled": true },
           "linter": {
             "enabled": true,
             "rules": { "recommended": true }
           },
           "formatter": {
             "enabled": true,
             "indentStyle": "space",
             "indentWidth": 2
           }
         }
         ```
      6. Update package.json scripts:
         ```json
         {
           "scripts": {
             "dev": "vinxi dev",
             "build": "vinxi build",
             "start": "vinxi start",
             "typecheck": "tsc --noEmit",
             "lint": "biome check .",
             "lint:fix": "biome check --write ."
           }
         }
         ```
      7. Create minimal `app/routes/__root.tsx` and `app/routes/index.tsx`
         with placeholder content so the router initializes.
      8. Run `pnpm dev` — confirm dev server starts on localhost:3000.
      9. Create `vitest.config.ts`:
         ```typescript
         import { defineConfig } from 'vitest/config'
         import react from '@vitejs/plugin-react'
         export default defineConfig({
           plugins: [react()],
           test: {
             environment: 'jsdom',
             setupFiles: ['./src/test-setup.ts'],
             coverage: {
               provider: 'v8',
               thresholds: { lines: 70, functions: 70, branches: 70 },
               exclude: ['_ref/**', 'app/routes/**', '**/*.stories.*'],
             },
           },
           resolve: {
             alias: { '@': new URL('./src', import.meta.url).pathname },
           },
         })
         ```
      10. Create `src/test-setup.ts`:
          ```typescript
          import '@testing-library/jest-dom'
          ```
      11. Add test scripts to package.json:
          ```json
          "test": "vitest",
          "test:coverage": "vitest run --coverage"
          ```

    validation:
      commands:
        - "pnpm tsc --noEmit"
        - "pnpm biome check ."
        - "pnpm dev --help"
      expected_output: No TS errors, no Biome errors, dev command found
      on_failure: Check pnpm-lock.yaml for version conflicts; verify app.config.ts syntax

  - id: m0-003
    name: Port design system — tokens and Tailwind config
    description: |
      Copy tokens.css and index.css verbatim from _ref/. Install Tailwind v4
      and configure it for TanStack Start. Verify utility classes resolve.
    estimate_minutes: 45
    type: config
    dependencies: [m0-002]
    files:
      create:
        - src/styles/tokens.css
        - src/index.css
      modify:
        - app/routes/__root.tsx
        - package.json
    instructions: |
      **Objective:**
      Restore the Sherpy botanical design system exactly as it existed in the
      Vite project. No token changes, no color changes, no naming changes.

      **Implementation Steps:**
      1. Install Tailwind v4:
         ```bash
         pnpm add tailwindcss @tailwindcss/vite tw-animate-css
         pnpm add @fontsource-variable/geist @fontsource-variable/bodoni-moda
         ```
      2. Create `src/styles/tokens.css` — copy verbatim from
         `_ref/src/styles/tokens.css` (no edits).
      3. Create `src/index.css` — copy verbatim from `_ref/src/index.css`.
         The @import of fonts, @import tailwindcss, @theme inline block,
         and @keyframes must all be preserved exactly.
      4. In `app/routes/__root.tsx`, import `../src/index.css` so styles
         apply globally.
      5. Add Tailwind Vite plugin to `app.config.ts`:
         ```typescript
         import tailwindcss from '@tailwindcss/vite'
         export default defineConfig({
           server: { preset: 'node-server' },
           vite: { plugins: [tailwindcss()] },
         })
         ```
      6. Verify: add a `<div className="bg-surface text-fg-1">test</div>` to
         the index route — confirm it renders with the correct paper-white
         background in the browser.

    validation:
      commands:
        - "pnpm tsc --noEmit"
        - "grep -r 'bg-surface' src/index.css"
      expected_output: tsc clean; bg-surface found in CSS
      on_failure: Verify @theme inline block is intact and @tailwindcss imported

  - id: m0-004
    name: Port shared UI primitives
    description: |
      Copy src/components/ui/, src/lib/utils.ts, and src/components/theme-provider/
