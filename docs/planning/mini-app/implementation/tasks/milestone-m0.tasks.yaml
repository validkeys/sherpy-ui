  - id: m0-007
    name: Wire smoke-test route and verify shell renders
    description: |
      Mount AppShell in the root route with its demo props. Confirm the full
      shell (LeftRail + Header + SpectrumStepper + ThreadView placeholder)
      renders in the browser without errors.
    estimate_minutes: 45
    type: code
    dependencies: [m0-006a, m0-006b, m0-006c]
    files:
      create: []
      modify:
        - app/routes/__root.tsx
        - app/routes/index.tsx
      touch_only: []
    instructions: |
      **Objective:**
      Visual smoke test — the shell must render with the same appearance
      as the old Storybook demo before any route logic is added.

      **Implementation Steps:**
      1. In `app/routes/__root.tsx`, wrap the outlet with ThemeProvider:
         ```tsx
         import { ThemeProvider } from '@/components/theme-provider'
         export function RootComponent() {
           return (
             <ThemeProvider>
               <Outlet />
             </ThemeProvider>
           )
         }
         ```
      2. In `app/routes/index.tsx`, render AppShell with its existing
         hardcoded demo props (same as _ref/src/components/app-shell/AppShell.tsx).
      3. Run `pnpm dev`, open browser, confirm:
         - LeftRail with Sherpy logo renders on the left
         - Header with breadcrumb renders at top
         - SpectrumStepper renders with botanical colors
         - ThreadView placeholder area visible
         - Dark/light theme toggle works
      4. Fix any runtime errors before proceeding.

    validation:
