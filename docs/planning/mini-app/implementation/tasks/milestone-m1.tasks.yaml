global_constraints:
  allowed_patterns:
    - "ONLY createServerFn from @tanstack/start for server-side logic"
    - "ONLY TanStack Query (useQuery / useMutation) for client state"
    - "ONLY in-memory module-level Map/Array for data persistence"
    - "ONLY Tailwind utility classes — no inline style= attributes"
    - "ONLY TypeScript — no plain JS files"
  forbidden_patterns:
    - "No useState for data that belongs in server state"
    - "No fetch() calls — all server communication via createServerFn"
    - "No localStorage or sessionStorage"
    - "No new component libraries beyond what is already installed"
  tdd_required: true
  max_task_duration_minutes: 90
  commit_strategy: "Commit after each task"
  drift_policy:
    stop_criteria:
      - Introduces dependency not listed in allowed_patterns
      - Edits touch >3 files not in this task's files section
      - Lint or type errors introduced that cannot be resolved within task scope
      - Test fails and model proposes modifying the test instead of fixing implementation
    on_detect: |
      STOP immediately. Do not continue editing.
      Summarize: (1) what you intended, (2) what you found, (3) which files were touched.
      Revert: git checkout -- .
      Create incident note: docs/drift-incidents/YYYY-MM-DD-<task-id>.md
    allowed_deviations:
      - Whitespace-only edits
      - Single-line refactor within targeted file if type-checked and in-scope

quality_gates:
  - stage: pre-commit
    commands:
      - "pnpm biome check --write ."
      - "pnpm tsc --noEmit"
      - "pnpm test --run"
  - stage: task-completion
    criteria:
      - All tests passing
      - No TypeScript errors
      - Biome passes
      - Feature works end-to-end in browser

tasks:
  - id: m1-001
    name: Define project types and in-memory store
    description: |
      Create the canonical TypeScript types for a Project record and the
      module-level in-memory store that all project server fns share.
    estimate_minutes: 45
    type: code
    dependencies: []
    files:
      create:
        - src/features/projects/types.ts
        - src/features/projects/store.ts
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Shared types used by both server fns and the client. The store module
      holds the single in-memory Map that acts as the fake database.

      **Implementation Steps:**
      1. `src/features/projects/types.ts`:
         ```typescript
         export type ProjectStatus = 'active' | 'archived' | 'complete'
         export type EntryPath = 'scratch' | 'doc-first'

         export interface Project {
           id: string            // nanoid(8)
           code: string          // SHR-XXXX auto-generated
           name: string
           status: ProjectStatus
           entryPath: EntryPath
           currentStep: number   // 1-10
           lastTouchedAt: string // ISO date string
           createdAt: string
         }

         export interface CreateProjectInput {
           name: string
           entryPath: EntryPath
         }
         ```
      2. `src/features/projects/store.ts`:
         ```typescript
         import { nanoid } from 'nanoid'
         import type { Project, CreateProjectInput } from './types'

         // Module-level store — resets on server restart by design
         const store = new Map<string, Project>()
         let codeCounter = 42

         function nextCode(): string {
           return `SHR-${String(codeCounter++).padStart(4, '0')}`
         }

         export function listProjects(): Project[] {
           return Array.from(store.values())
             .sort((a, b) => b.lastTouchedAt.localeCompare(a.lastTouchedAt))
         }

         export function createProject(input: CreateProjectInput): Project {
           const now = new Date().toISOString()
           const project: Project = {
             id: nanoid(8),
             code: nextCode(),
             name: input.name,
             status: 'active',
             entryPath: input.entryPath,
             currentStep: 1,
             lastTouchedAt: now,
             createdAt: now,
           }
           store.set(project.id, project)
           return project
         }

         export function updateProjectStatus(
           id: string,
           status: Project['status']
         ): Project {
           const project = store.get(id)
           if (!project) throw new Error(`Project not found: ${id}`)
           const updated = { ...project, status, lastTouchedAt: new Date().toISOString() }
           store.set(id, updated)
           return updated
         }

         export function getProject(id: string): Project | undefined {
           return store.get(id)
         }
         ```
      3. Install nanoid: `pnpm add nanoid`

      **TDD Checklist:**
      - [ ] Write tests for listProjects (empty, with items, sort order)
      - [ ] Write tests for createProject (id generated, code increments, defaults)
      - [ ] Write tests for updateProjectStatus (found, not-found error)
      - [ ] Run tests — all pass before committing

    validation:
      commands:
        - "pnpm tsc --noEmit"
        - "pnpm test --run src/features/projects/store.test.ts"
      expected_output: tsc clean, all store tests pass
      on_failure: Fix type errors; ensure nanoid is installed

  - id: m1-002
    name: Project server functions (list, create, updateStatus)
    description: |
      Expose the store operations as TanStack Start server functions.
      These are the only API surface for project CRUD.
    estimate_minutes: 60
    type: code
    dependencies: [m1-001]
    files:
      create:
        - src/features/projects/server.ts
        - src/features/projects/server.test.ts
      modify: []
      touch_only:
        - src/features/projects/store.ts
    instructions: |
      **Objective:**
      createServerFn wrappers around store operations. TypeScript types
      flow end-to-end — no `any`, no type assertions.

      **Implementation Steps:**
      1. `src/features/projects/server.ts`:
         ```typescript
         import { createServerFn } from '@tanstack/start'
         import { listProjects, createProject, updateProjectStatus } from './store'
         import type { CreateProjectInput } from './types'

         export const $listProjects = createServerFn({ method: 'GET' })
           .handler(() => listProjects())

         export const $createProject = createServerFn({ method: 'POST' })
           .validator((data: unknown): CreateProjectInput => {
             if (typeof data !== 'object' || data === null)
               throw new Error('invalid input: expected object')
             const d = data as Record<string, unknown>
             if (typeof d.name !== 'string' || !d.name.trim())
               throw new Error('name is required')
             if (d.entryPath !== 'scratch' && d.entryPath !== 'doc-first')
               throw new Error('invalid entryPath')
             return { name: d.name.trim(), entryPath: d.entryPath as 'scratch' | 'doc-first' }
           })
           .handler(({ data }) => createProject(data))

         export const $updateProjectStatus = createServerFn({ method: 'POST' })
           .validator((data: unknown) => {
             if (typeof data !== 'object' || data === null)
               throw new Error('invalid input: expected object')
             const d = data as Record<string, unknown>
             if (typeof d.id !== 'string' || !d.id) throw new Error('id is required')
             if (d.status !== 'archived' && d.status !== 'complete')
               throw new Error('status must be archived or complete')
             return { id: d.id, status: d.status as 'archived' | 'complete' }
           })
           .handler(({ data }) => updateProjectStatus(data.id, data.status))
         ```
      2. Write integration tests in `server.test.ts` using Vitest.
         Import and call the server fns directly (no HTTP layer needed).

      **TDD Checklist:**
      - [ ] Test: $listProjects returns empty array initially
      - [ ] Test: $createProject creates a project with valid input
      - [ ] Test: $createProject throws on missing name
      - [ ] Test: $updateProjectStatus archives a project
      - [ ] Test: $updateProjectStatus throws on unknown id

    validation:
      commands:
        - "pnpm tsc --noEmit"
        - "pnpm test --run src/features/projects/server.test.ts"
      expected_output: tsc clean, all server fn tests pass
      on_failure: Check createServerFn import path; verify validator types

  - id: m1-003
    name: TanStack Query hooks for project operations
    description: |
      Client-side hooks that call server fns and manage cache invalidation.
      These are the only hooks components import for project data.
    estimate_minutes: 45
    type: code
    dependencies: [m1-002]
    files:
      create:
        - src/features/projects/hooks.ts
      modify: []
      touch_only:
        - src/features/projects/server.ts
    instructions: |
      **Objective:**
      Thin wrapper hooks over TanStack Query. No business logic here —
      just cache key management and mutation callbacks.

      **Implementation Steps:**
      ```typescript
      // src/features/projects/hooks.ts
      import { useQuery, useMutation, useQueryClient } from '@tanstack/react-query'
      import { $listProjects, $createProject, $updateProjectStatus } from './server'
      import type { CreateProjectInput } from './types'

      export const projectsQueryKey = ['projects'] as const

      export function useProjects() {
        return useQuery({
          queryKey: projectsQueryKey,
          queryFn: () => $listProjects(),
        })
      }

      export function useCreateProject() {
        const qc = useQueryClient()
        return useMutation({
          mutationFn: (input: CreateProjectInput) => $createProject({ data: input }),
          onSuccess: () => qc.invalidateQueries({ queryKey: projectsQueryKey }),
        })
      }

      export function useUpdateProjectStatus() {
        const qc = useQueryClient()
        return useMutation({
          mutationFn: (vars: { id: string; status: 'archived' | 'complete' }) =>
            $updateProjectStatus({ data: vars }),
          onSuccess: () => qc.invalidateQueries({ queryKey: projectsQueryKey }),
        })
      }
      ```

      **TDD Checklist:**
      - [ ] No logic to test directly — type-check is the validation here
      - [ ] tsc --noEmit passes on hooks.ts

    validation:
      commands:
        - "pnpm tsc --noEmit"
      expected_output: tsc clean
      on_failure: Verify @tanstack/react-query installed; check import from server.ts

