notes: |
  Root Cause: The PR #12 SQLite database integration uses __dirname in
  src/lib/db/migrate.ts line 6 to resolve the migrations directory path.
  However, __dirname is a CommonJS variable that is not available in ES modules.

  Solution: Replace __dirname with import.meta.url or use a Vite-compatible
  approach for resolving file paths. Example:

  import { fileURLToPath } from 'url';
  import { dirname } from 'path';
  const __dirname = dirname(fileURLToPath(import.meta.url));

  Or use a Vite glob import for migrations:
  const migrations = import.meta.glob('./migrations/*.sql', { eager: true, as: 'raw' });

  This is a critical blocker introduced in PR #12 that must be fixed before
  the SQLite integration can be merged or tested.
