notes: |
  This bug has a similar pattern to BUG-012 where form submissions don't save data. However,
  BUG-012 was in Step 1 (Gap Analysis) and has been fixed. This bug is specific to Step 2
  (Business Requirements Interview).

  Key difference: Q1 DOES save successfully, but Q2-Q10 do not. This suggests the submit handler
  works initially but then stops working after the first successful submission.

  Possible causes to investigate:
  1. Event listener not re-attaching after first submit
  2. XState machine not properly handling subsequent SUBMIT_ANSWER events
  3. React state not updating correctly after first answer
  4. API call failing silently on Q2+ (need to check network tab)

fix_analysis: |
  ROOT CAUSE FOUND: React.useState was creating a NEW actor on every mount, including after
  StrictMode remounts. This meant:
  - First mount: actor1 created and started
  - StrictMode unmount: actor1 kept running (BUG-012 fix)
  - StrictMode remount: actor2 created (NEW instance!)
  - Q1 worked because it happened before remount
  - Q2+ failed because events went to actor2, but actor1 was the persisted one

  FIX: Changed from React.useState to React.useMemo with empty deps [] to ensure single
  actor instance survives StrictMode unmount→remount cycle.

  See: .tmp-docs/plan/bug-reports/013-fix-summary.md for full analysis
