summary: |
  After successfully completing Step 1 (gap analysis), Step 2 loads the first Business Requirements
  interview question correctly. However, clicking "Submit Answer" button does not save the response
  to step2Answers array in XState context. Only the first answer (Q1) was saved successfully, but
