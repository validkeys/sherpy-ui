expected_behavior: |
  When user types or selects an answer and clicks "Submit Answer", the response should be added to
  step2Answers array in XState context, and the next question should load within 3-5 seconds.

actual_behavior: |
  - Q1 submits successfully (step2Answers.length = 1)
  - Q2-Q10: Clicking "Submit Answer" appears to work (UI doesn't show errors) but answer is NOT
    added to step2Answers array
  - step2Answers remains at length 1 even after multiple submit attempts
  - Current question does not change to Q3 after submitting Q2
  - Form remains on the same question indefinitely

