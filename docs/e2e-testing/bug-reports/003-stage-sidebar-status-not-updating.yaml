  When the user is on Step 2 (Business Requirements), the stage sidebar should show:
  - Stage 1: Gap Analysis Worksheet — complete (or checkmark)
  - Stage 2: Business Requirements Interview — now (active indicator)
  - Stage 3-10: pending

actual_behavior: |
  When on Step 2 with "Business Requirements" heading and active interview question:
  - Stage 1: Gap Analysis Worksheet — now (still showing as active)
  - Stage 2: Business Requirements Interview — pending (should be "now")
  - Stage 3-10: pending

  The sidebar doesn't reflect the current step position.

