# Impact
workflow_impact: |
  Users cannot navigate to existing projects from the dashboard using the normal UI
  controls. This blocks the primary user workflow. Only workaround is to manually
  construct and enter URLs in the address bar.

workaround: |
  Direct URL navigation works: manually navigate to http://localhost:5180/project/{projectId}/build
  Example: http://localhost:5180/project/seed-0002/build successfully loads the project.

