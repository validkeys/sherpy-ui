# Description
summary: |
  Clicking on project cards, recent run buttons, or workspace project buttons in the
  dashboard does not navigate to the project build page. Multiple navigation attempts
  either stay on the dashboard or fail to reach the intended project.

expected_behavior: |
  When clicking on a project card (e.g., "billing-platform") or a recent run button
  (e.g., "biz-req-04"), the browser should navigate to /project/{projectId}/build
  and load that project's current step.

actual_behavior: |
  Navigation does not occur. URL remains at /dashboard or navigates back to dashboard
  instead of the project page. Tested multiple elements:
  - Project cards in Active tab (@e12 - billing-platform card)
  - Recent run buttons (@e5 - biz-req-04, @e6 - biz-req-03)
  - Workspace project buttons (@e3 - billing-platform)

  None successfully navigated to the project.

# Reproduction
steps_to_reproduce:
  - "Navigate to http://localhost:5180 (dashboard loads)"
  - "Click on any project card in the Active tab (e.g., 'billing-platform' project)"
  - "Observe URL - it remains at /dashboard or doesn't navigate to project"
  - "Alternative: Click on recent run button (e.g., 'biz-req-04')"
  - "Observe same behavior - no navigation occurs"

reproduction_rate: always

