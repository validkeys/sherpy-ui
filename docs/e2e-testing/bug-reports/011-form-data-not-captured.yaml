notes: |
  IMPORTANT DISTINCTION FROM BUG-009:
  - BUG-009 claimed localStorage was never created
  - This bug shows localStorage IS created correctly with proper initial state
  - The issue is that form data is NOT being captured when Submit is clicked

  XSTATE STATE VERIFIED:
  - Before submit: state = {step1_gapAnalysis: "collecting"}, step1Responses = {}
  - After submit (60s): state = {step1_gapAnalysis: "collecting"}, step1Responses = {}
  - No state transition occurs, suggesting the submit handler is not firing or not capturing form values

  ROOT CAUSE IDENTIFIED:
  - PlanningMachineContext.tsx was saving PARTIAL snapshots: {value, context}
  - XState v5 requires COMPLETE snapshots with: status, value, context, children, historyValue, tags
  - Restoring from partial snapshot caused actor to enter ERROR state
  - Actor in error state silently ignores all events (including SUBMIT_FORM)
  - This explained why:
    * localStorage existed with correct initial state ✓
    * Form submit sent event correctly ✓
    * But nothing happened (event ignored by error-state actor) ✗

  FIX APPLIED:
  - Changed saveState() to use snapshot.toJSON() instead of manual {value, context}
  - Added validation in loadState() to detect and clear old partial snapshots
  - Automatic migration: clears corrupted state, starts fresh with complete snapshot
  - All subsequent saves now use complete XState v5 snapshot format

  VERIFICATION:
  - Created debug script that reproduced exact error
  - Verified fix resolves the issue
  - Added regression tests to FormStep.test.tsx
  - All unit tests pass
