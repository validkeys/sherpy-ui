      - "Added per-step protocol (before/during/after)"
      - "Added blocking bug protocol"
      - "Added completion checklist"
      - "Added critical rules section"
      - "Restructured as actionable instructions vs reference doc"

  "1.0":
    date: "2026-05-12"
    changes:
      - "Initial version (brief reference format)"
