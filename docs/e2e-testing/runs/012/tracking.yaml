retired_bugs:
  - bug_id: "playwright-mcp-initialization-unfixable"
    title: "Playwright MCP server cannot be configured to use Chromium in this environment"
    severity: "blocker"
    description: |
      The Playwright MCP server is hardcoded to look for Chrome at /opt/google/chrome/chrome.
      Error: "Chromium distribution 'chrome' is not found at /opt/google/chrome/chrome"

      Attempted fixes (all failed):
      1. Set PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH in ~/.claude/.claude.json - not respected
      2. Restarted Claude Code - MCP server still doesn't use the env var
      3. Created playwright.config.ts with executablePath - MCP server doesn't read it
      4. Tried to create symlink /opt/google/chrome/chrome -> /usr/bin/chromium - requires sudo password

      Root cause:
      - Playwright MCP @playwright/mcp package hardcodes Chrome path
      - Environment variables in MCP config are not passed to the spawned process correctly
      - MCP server process runs without the PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH variable
      - No way to modify MCP server environment after it starts

      Resolution: UNFIXABLE in current Claude Code/MCP environment without:
      - System-level symlink (requires root access)
      - OR installing actual Chrome binary
      - OR MCP server restart mechanism
      - OR different browser automation tool (agent-browser has React form issues per CLAUDE.md)

    filed_at: "2026-05-15"
    resolution: "unfixable_in_current_environment"
    workaround: "Use manual browser testing per MANUAL-TEST-STEPS.md"

observations:
  - observation: "Playwright MCP configuration requires Claude Code restart"
    timestamp: "2026-05-15"
    details: |
      When updating MCP server environment variables in ~/.claude/.claude.json,
      the changes are not picked up by already-running MCP servers.

      This means automated testing with Playwright MCP requires:
      1. Set PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH in config
      2. Restart Claude Code
      3. Then run tests

      Cannot be done within a single session.
