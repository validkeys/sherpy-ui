      ## LLM Prompt Strategy
      Analyze user input for signals:
      - Gap analysis NEEDED: "existing requirements", "have PRDs", "current docs", "align with"
      - Gap analysis NOT needed: "from scratch", "new project", "greenfield", "just an idea"
      - Return JSON: { needsGapAnalysis: boolean, reasoning: string, confidence: 'high'|'medium'|'low' }

      ## Error Handling
      - On LLM error: default to needsGapAnalysis: true (conservative)
      - Log all errors for debugging
      - Never throw (graceful degradation)

