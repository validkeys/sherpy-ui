  - id: m1-001
    name: "Refactor $submitAnswer to pure domain logic"
    description: |
      Remove database persistence calls from $submitAnswer server function.
      Keep only domain transformation (submitStepAnswer). Persistence now
      handled by StatePersistence subscription.
    estimate_minutes: 45
    type: code
    dependencies: []
    files:
      create: []
      modify:
        - src/features/planning/infrastructure/server-functions.ts
      touch_only: []
    style_anchor_refs:
      - "src/features/planning/domain/step-commands.ts:1-50"
    instructions: |
      **Objective:**
      Remove ALL persistence calls from $submitAnswer (lines 178-274).
      Make it a pure domain transformation function.

      **Style Anchors:**
      Follow pure domain patterns from:
      - step-commands.ts:1-50 (pure functions, no side effects)

      **Implementation Steps:**

      1. Locate $submitAnswer function (around line 178):
      ```typescript
      export const $submitAnswer = createServerFn({ method: "POST" })
        .handler(async ({ data }) => {
          // ... code ...
        });
      ```

      2. REMOVE persistence calls from handler:

      **BEFORE (lines 220-257):**
      ```typescript
      try {
        const currentState = await loadPlanningState(data.projectId);
        if (!currentState) {
          throw new Error("Project not found");
        }

        const newState = submitStepAnswer(
          currentState,
          data.stepNumber,
          data.question,
          data.answer
        );

        // ❌ REMOVE THIS BLOCK:
        if (data.stepNumber === 2 || data.stepNumber === 3) {
          await Promise.all([
            savePlanningState(data.projectId, newState as unknown as Record<string, unknown>),
            saveInterviewAnswer(data.projectId, data.stepNumber, data.question, data.answer),
          ]);
        } else {
          await savePlanningState(data.projectId, newState as unknown as Record<string, unknown>);
        }

        logServerAction("submitAnswer.success", { ... });
        return newState;
      } catch (error) {
        // ...
      }
      ```

      **AFTER (simplified):**
      ```typescript
      try {
        const currentState = await loadPlanningState(data.projectId);
        if (!currentState) {
          throw new Error("Project not found");
        }

        // ✅ PURE DOMAIN LOGIC ONLY
        const newState = submitStepAnswer(
          currentState,
          data.stepNumber,
          data.question,
          data.answer
        );

        logServerAction("submitAnswer.success", {
          projectId: data.projectId,
          stepNumber: data.stepNumber,
        });

        // ✅ Return new state - persistence handled by StatePersistence
        return newState;
      } catch (error) {
        logServerAction("submitAnswer.error", {
          projectId: data.projectId,
          stepNumber: data.stepNumber,
          error: error instanceof Error ? error.message : "Unknown error",
        });
        throw error;
      }
      ```

      3. Update JSDoc comment to reflect new behavior:
      ```typescript
      /**
       * Server function: Submit an interview answer (Steps 2 & 3)
       *
       * Flow:
       * 1. Load current state
       * 2. Apply domain logic (submitStepAnswer)
       * 3. Return new state (persistence via StatePersistence subscription)
       */
      ```

      **Constraints:**
      - ONLY modify $submitAnswer function
      - Remove ALL savePlanningState() calls
      - Remove ALL saveInterviewAnswer() calls
      - Keep domain logic (submitStepAnswer)
      - Keep error handling and logging

      **Validation:**
      ```bash
      grep -n "savePlanningState" src/features/planning/infrastructure/server-functions.ts
      ```
      Expected: 0 occurrences in $submitAnswer

      **Drift Policy:**
      Do not add new dependencies or change function signature.

    validation:
      commands:
        - grep -c "savePlanningState" src/features/planning/infrastructure/server-functions.ts
      expected_output: "Should show reduced count"
      on_failure: "Ensure all persistence calls removed"

