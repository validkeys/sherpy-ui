# Milestone M1: Phase 2 - Remove Redundant Persistence
# Estimated Duration: 1 day
# Strategy: Remove persistence from server functions (make them pure domain logic)

version: "1.0"
milestone: m1
milestone_name: "Phase 2: Remove Redundant Persistence"

style_anchors:
  - path: "src/features/planning/infrastructure/server-functions.ts"
    lines: "178-274"
    description: "Server function pattern to refactor (remove persistence calls)"
    demonstrates: "What needs to be simplified (domain logic only)"

  - path: "src/features/planning/domain/step-commands.ts"
    lines: "1-50"
    description: "Pure domain functions (no side effects)"
    demonstrates: "Target pattern for server functions"

global_constraints:
  - "ONLY modify files listed in each task"
  - "Remove ALL savePlanningState() calls from server functions"
  - "Remove ALL saveInterviewAnswer() calls from server functions"
  - "Remove ALL saveFormResponse() calls from server functions"
  - "Keep domain logic (state transformations)"
  - "Update test mocks (remove persistence expectations)"
  - "Verify StatePersistence is sole persistence mechanism"

quality_gates:
  pre_commit:
    - command: "npm run lint"
      must_pass: true
    - command: "npm run typecheck"
      must_pass: true
    - command: "npm test"
      must_pass: true

  ci:
    - command: "npm run lint"
    - command: "npm run typecheck"
    - command: "npm test"
    - command: "npm run test:integration"

tdd_checklist:
  - "[ ] Update tests FIRST (remove persistence mocks)"
  - "[ ] Tests should fail (RED)"
  - "[ ] Remove persistence from implementation (GREEN)"
  - "[ ] Verify tests pass"
  - "[ ] Commit after GREEN"

