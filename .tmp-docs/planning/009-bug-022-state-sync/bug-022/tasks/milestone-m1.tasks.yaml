    instructions: |
      **Objective:**
      Create test that proves StatePersistence is the ONLY mechanism that writes
      to database. Server functions should NOT write to DB.

      **Implementation Steps:**

      1. Create file: `src/features/planning/__tests__/bug-022-single-persistence-path.test.ts`

      2. Write verification test:
      ```typescript
      import { describe, expect, it } from "vitest";
      import * as fs from "fs";
      import * as path from "path";

      describe("BUG-022: Single Persistence Path Verification", () => {
        it("server-functions.ts has zero database write calls", () => {
          const filePath = path.join(
            __dirname,
            "../infrastructure/server-functions.ts"
          );
          const content = fs.readFileSync(filePath, "utf-8");

          // Check for persistence calls (should be 0 outside $savePlanningState)
          const lines = content.split("\n");
          let inSavePlanningStateFunction = false;
          let persistenceCalls = 0;

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];

            // Track if we're inside $savePlanningState function
            if (line.includes("$savePlanningState =")) {
              inSavePlanningStateFunction = true;
            }
            if (inSavePlanningStateFunction && line.includes("});")) {
              inSavePlanningStateFunction = false;
            }

            // Count persistence calls OUTSIDE $savePlanningState
            if (!inSavePlanningStateFunction) {
              if (
                line.includes("savePlanningState(") &&
                !line.includes("//") &&
                !line.includes("await savePlanningState")
              ) {
                persistenceCalls++;
                console.log(`Found persistence call at line ${i + 1}: ${line.trim()}`);
              }
            }
          }

          // ✅ ASSERTION: Zero persistence calls outside $savePlanningState
          expect(persistenceCalls).toBe(0);
        });

        it("planningMachine.ts has zero persistence helpers", () => {
          const filePath = path.join(
            __dirname,
            "../machines/planningMachine.ts"
          );
          const content = fs.readFileSync(filePath, "utf-8");

          // Check for persistence helpers (should be 0)
          expect(content).not.toContain("persistInterviewAnswerToDatabase");
          expect(content).not.toContain("persistFormResponsesToDatabase");
        });

        it("StatePersistence is documented as sole persistence mechanism", () => {
          const filePath = path.join(
            __dirname,
            "../infrastructure/persistence.ts"
          );
          const content = fs.readFileSync(filePath, "utf-8");

          // Verify documentation mentions single persistence layer
          expect(content).toContain("StatePersistence");
          expect(content.length).toBeGreaterThan(100); // Non-empty file
        });
      });
      ```

      **Constraints:**
      - Static analysis test (no runtime mocking)
      - Verify zero persistence calls outside allowed functions
      - Document findings

      **Validation:**
      ```bash
      npm test src/features/planning/__tests__/bug-022-single-persistence-path.test.ts
      ```
      Expected: Test passes (confirms single persistence path)

