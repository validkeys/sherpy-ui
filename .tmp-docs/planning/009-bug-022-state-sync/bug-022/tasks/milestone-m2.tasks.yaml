# Milestone M2: Phase 3 - Production Rollout & Monitoring
# Estimated Duration: 3 days
# Strategy: Gradual rollout (10% → 50% → 100%) with comprehensive monitoring

version: "1.0"
milestone: m2
milestone_name: "Phase 3: Production Rollout & Monitoring"

style_anchors:
  - path: "docs/deployment/gradual-rollout.md"
    description: "Gradual rollout procedures (if exists)"
    demonstrates: "How to safely roll out changes to production"

global_constraints:
  - "Gradual rollout ONLY (10% → 50% → 100%)"
  - "Monitor at each step before proceeding"
  - "Rollback plan ready at all times"
  - "Zero data loss tolerance"
  - "Comprehensive observability required"

quality_gates:
  staging:
    - command: "npm test"
      must_pass: true
    - command: "npm run lint"
      must_pass: true
    - command: "npm run typecheck"
      must_pass: true
    - validation: "Manual QA on staging"
      must_pass: true

  production_10pct:
    - validation: "Zero data loss incidents (1 hour)"
      must_pass: true
    - validation: "Error rate < 0.1%"
      must_pass: true
    - validation: "Database write volume reduced"
      must_pass: false

  production_50pct:
    - validation: "Zero data loss incidents (4 hours)"
      must_pass: true
    - validation: "Error rate < 0.1%"
      must_pass: true
    - validation: "Performance metrics stable"
      must_pass: true

  production_100pct:
    - validation: "Zero data loss incidents (24 hours)"
      must_pass: true
    - validation: "Error rate < 0.1%"
      must_pass: true
    - validation: "Database write reduction confirmed (60-70%)"
      must_pass: false

tasks:
  # ============================================================================
  # Task 1: Deploy to staging
  # ============================================================================
  - id: m2-001
    name: "Deploy Phase 2 changes to staging environment"
    description: |
      Deploy all Phase 1 + Phase 2 changes to staging for final validation
      before production rollout.
    estimate_minutes: 60
    type: deployment
    dependencies: []
    files:
      create:
        - .tmp-docs/deployments/bug-022-staging-deployment.md
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Deploy complete BUG-022 fix to staging environment and verify functionality.

      **Pre-Deployment Checklist:**
      - [ ] All Phase 1 tasks complete (m0-001 through m0-007)
      - [ ] All Phase 2 tasks complete (m1-001 through m1-010)
      - [ ] All tests passing locally
      - [ ] Code reviews completed with sign-off
      - [ ] Database migrations ready (if any)

      **Deployment Steps:**

      1. Create deployment document:
      ```bash
      mkdir -p .tmp-docs/deployments
      touch .tmp-docs/deployments/bug-022-staging-deployment.md
      ```

      2. Document deployment plan:
      ```markdown
      # BUG-022 Staging Deployment

      **Date:** 2026-06-01
      **Environment:** Staging
      **Changes:** Phase 1 + Phase 2 (StatePersistence + server function refactoring)

      ## Pre-Deployment
      - [x] All tests passing
      - [x] Code reviews complete
      - [ ] Database backup created
      - [ ] Rollback plan documented

      ## Deployment Commands
      ```bash
      # Build production bundle
      npm run build

      # Deploy to staging
      npm run deploy:staging

      # Verify deployment
      curl https://staging.app.com/health
      ```

      ## Post-Deployment Validation
      - [ ] Health check passes
      - [ ] Smoke tests pass
      - [ ] Manual QA workflow (Steps 1-7 + refresh)
      - [ ] Database writes monitored
      - [ ] Error rates checked

      ## Metrics to Monitor
      - Data loss incidents: 0 expected
      - Error rate: < 0.1% expected
      - Database write volume: 60-70% reduction expected
      - Persistence latency: p95 < 2s expected
      ```

      3. Execute deployment:
      ```bash
      # Build
      npm run build

      # Deploy to staging
      npm run deploy:staging
      # (Adjust command based on actual deployment process)
      ```

      4. Post-deployment validation:
      ```bash
      # Health check
      curl https://staging.app.com/health

      # Run smoke tests
      npm run test:smoke
      ```

      5. Manual QA:
      - Open staging app
      - Create new project
      - Progress through Steps 1-7
      - Refresh page at Step 7
      - Verify state preserved (not lost)
      - Check browser console for errors
      - Check database for persistence

      **Validation:**
      - [ ] Deployment successful
      - [ ] Health checks pass
      - [ ] Smoke tests pass
      - [ ] Manual QA passes
      - [ ] No errors in logs

      **Rollback Plan:**
      If issues found:
      ```bash
      # Rollback to previous version
      npm run deploy:staging -- --rollback
      ```

      **Constraints:**
      - Do NOT deploy to production yet
      - Monitor staging for 24 hours minimum
      - Document all issues found

    validation:
      commands:
        - echo "Manual validation required"
      expected_output: "Deployment successful, QA passes"
      on_failure: "Fix issues, redeploy, do not proceed to production"

