  - id: m2-006
    name: "Create monitoring dashboard for StatePersistence"
    description: |
      Build comprehensive monitoring dashboard to track persistence health,
      performance, and errors in real-time.
    estimate_minutes: 120
    type: infrastructure
    dependencies: [m2-001]
    files:
      create:
        - src/features/planning/infrastructure/persistence-metrics.ts
        - docs/monitoring/state-persistence-dashboard.md
      modify: []
      touch_only: []
    instructions: |
      **Objective:**
      Create monitoring infrastructure to track StatePersistence health in production.

      **Metrics to Track:**

      1. **Persistence Success Rate**
         - Metric: `persistence.success.count` / `persistence.total.count`
         - Target: > 99.9%
         - Alert: < 99%

      2. **Persistence Latency**
         - Metric: `persistence.latency.p50`, `p95`, `p99`
         - Target: p95 < 2s
         - Alert: p95 > 5s

      3. **Debounce Efficiency**
         - Metric: `persistence.debounce.batched_count`
         - Target: 3-5 transitions per DB write
         - Info only

      4. **Error Rate**
         - Metric: `persistence.error.count`
         - Target: < 0.1%
         - Alert: > 0.5%

      5. **Queue Depth** (if retry logic added)
         - Metric: `persistence.queue.depth`
         - Target: < 10
         - Alert: > 50

      **Implementation:**

      1. Create metrics file: `src/features/planning/infrastructure/persistence-metrics.ts`

      ```typescript
      // Metrics helpers for StatePersistence
      export function trackPersistenceSuccess(durationMs: number): void {
        // Integrate with your metrics system (Datadog, CloudWatch, etc.)
        console.log("[Metrics] persistence.success", { duration: durationMs });
      }

      export function trackPersistenceError(error: unknown): void {
        console.error("[Metrics] persistence.error", { error });
      }

      export function trackDebounceEfficiency(batchSize: number): void {
        console.log("[Metrics] persistence.debounce.batch_size", { batchSize });
      }
      ```

      2. Integrate into StatePersistence class:

      ```typescript
      // In persistence.ts
      import {
        trackPersistenceSuccess,
        trackPersistenceError,
        trackDebounceEfficiency,
      } from "./persistence-metrics";

      private async persistAllToDatabase(snapshot: SnapshotType): Promise<void> {
        const startTime = Date.now();

        try {
          // ... persistence logic ...

          const duration = Date.now() - startTime;
          trackPersistenceSuccess(duration);
        } catch (error) {
          trackPersistenceError(error);
          throw error;
        }
      }
      ```

      3. Document dashboard:

      Create `docs/monitoring/state-persistence-dashboard.md`:

      ```markdown
      # State Persistence Monitoring Dashboard

      ## Key Metrics

