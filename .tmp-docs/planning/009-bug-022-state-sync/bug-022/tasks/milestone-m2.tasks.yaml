      - **Query:** `persistence.success.count / persistence.total.count`
      - **Target:** > 99.9%
      - **Alert:** < 99%

      ### Latency (p95)
      - **Query:** `percentile(persistence.latency, 95)`
      - **Target:** < 2s
      - **Alert:** > 5s

      ### Error Rate
      - **Query:** `persistence.error.count / persistence.total.count`
      - **Target:** < 0.1%
      - **Alert:** > 0.5%

      ## Dashboards

      - **Production:** [Link to dashboard]
      - **Staging:** [Link to dashboard]

      ## Alerts

      - **Critical:** Data loss detected
      - **Warning:** Error rate > 0.5%
      - **Info:** Latency > 2s
      ```

      **Validation:**
