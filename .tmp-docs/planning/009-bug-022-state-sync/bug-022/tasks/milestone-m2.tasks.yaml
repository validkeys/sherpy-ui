      ```markdown
      # BUG-022 Rollback Procedures

      ## Overview

      This runbook documents rollback procedures for BUG-022 (State Loss Fix)
      at each deployment phase.

      ## Phase 1 Rollback (If issues in staging)

      **Trigger:** Issues found during staging validation

      **Steps:**
      1. Feature flag to 0%:
         ```bash
         feature-flag set bug-022-state-persistence --percentage 0
         ```

      2. Revert code changes:
         ```bash
         git revert <commit-hash-phase1>
         npm run build
         npm run deploy:staging
         ```

      3. Verify rollback:
         ```bash
         # Run smoke tests
         npm run test:smoke

         # Verify old persistence working
         # (Check server function logs for savePlanningState calls)
         ```

      4. Root cause analysis:
         - Review error logs
         - Identify regression
         - Fix in development
         - Re-test before re-deployment

      **Recovery Time:** < 5 minutes

      ## Phase 2 Rollback (If issues after removing redundancy)

      **Trigger:** Data loss or server function errors

      **Steps:**
      1. Revert Phase 2 commits:
         ```bash
         git revert <commit-hash-phase2>
         npm run build
         npm run deploy:staging
         ```

      2. Result: Back to dual persistence (Phase 1 state)
         - StatePersistence active ✅
         - Server function persistence active ✅

      3. Investigate server function issues

      **Recovery Time:** < 5 minutes

      ## Phase 3 Rollback (Production issues)

      **Trigger:** Data loss, critical bugs, or high error rate in production

      ### Immediate Rollback (10% or 50%)

      ```bash
      # Reduce percentage or disable completely
      feature-flag set bug-022-state-persistence --percentage 0
      ```

      **Recovery Time:** < 1 minute

      ### Full Rollback (100%)

      1. Disable feature flag:
         ```bash
         feature-flag set bug-022-state-persistence --percentage 0
         ```

      2. Deploy previous version:
         ```bash
         git checkout <previous-release-tag>
         npm run build
         npm run deploy:production
         ```

      3. Verify production health:
         ```bash
         curl https://app.com/health
         npm run test:smoke:production
         ```

      **Recovery Time:** < 10 minutes

      ## Rollback Decision Matrix

      | Symptom | Severity | Rollback Level | Timeline |
      |---------|----------|----------------|----------|
      | Data loss (1+ incidents) | CRITICAL | Immediate (0%) | < 1 min |
      | Error rate > 1% | HIGH | Reduce to previous % | < 2 min |
      | Error rate 0.5-1% | MEDIUM | Hold & investigate | N/A |
      | Performance degradation | MEDIUM | Monitor 30min, then decide | 30 min |
      | Minor bugs | LOW | Fix forward | N/A |

      ## Post-Rollback

      1. Notify team
      2. Create incident post-mortem
      3. Root cause analysis
      4. Fix in development
      5. Re-test in staging
      6. Re-attempt rollout when ready

      ## Contacts

      - **On-Call Engineer:** [Contact]
      - **Engineering Lead:** [Contact]
      - **Database Team:** [Contact]
      ```

      **Validation:**
      - Runbook created
      - Rollback procedures documented
      - Decision matrix clear

    validation:
      commands:
        - ls docs/runbooks/bug-022-rollback-procedure.md
      expected_output: "Runbook exists"
      on_failure: "Complete runbook before production"

