      ```typescript
      import { render, screen, waitFor } from "@testing-library/react";
      import { userEvent } from "@testing-library/user-event";
      import React from "react";
      import { beforeEach, describe, expect, it, vi } from "vitest";
      import { Navigation } from "../components/Navigation";
      import { StepContainer } from "../components/StepContainer";
      import {
        PlanningMachineProvider,
        usePlanningMachine,
      } from "../machines/PlanningMachineContext";

      // Mock AI functions
      vi.mock("../../ai/server", () => ({
        $generateArtifact: vi.fn(async ({ data }) => ({
          format: "yaml" as const,
          content: `# Mock Artifact Step ${data.stepNumber}`,
          generatedAt: new Date().toISOString(),
        })),
        $generateQuestion: vi.fn(async () => ({
          question: "Mock question?",
          options: ["Yes", "No"],
        })),
      }));

      describe("BUG-022: Page Refresh at Step 7 (E2E)", () => {
        const user = userEvent.setup();

        beforeEach(() => {
          vi.clearAllMocks();
          if (typeof localStorage !== "undefined" && localStorage.clear) {
            localStorage.clear();
          }
        });

        it("preserves state after page refresh at Step 7", {
          timeout: 30000,
        }, async () => {
          const projectId = "bug-022-e2e-test";

          function TestWorkflow() {
            const actor = usePlanningMachine();

            React.useEffect(() => {
              actor.send({ type: "START_PLANNING" });
            }, [actor]);

            return (
              <div data-testid="planning-workflow">
                <Navigation />
                <StepContainer />
              </div>
            );
          }

          // ====================================================================
          // PHASE 1: Progress through Steps 1-7
          // ====================================================================
          const { unmount } = render(
            <PlanningMachineProvider
              input={{ projectId }}
              storageKey={`planning-machine-${projectId}`}
            >
              <TestWorkflow />
            </PlanningMachineProvider>
          );

          // Wait for Step 1
          await waitFor(
            () => {
              expect(screen.getByText(/Step 1 of 10/i)).toBeDefined();
            },
            { timeout: 3000 }
          );

          // Fill Step 1 form
          const projectDescInput = screen.getByLabelText(/what are you building/i);
          await user.type(projectDescInput, "E2E test project");

          const requirementsInput = screen.getByLabelText(/existing requirements/i);
          await user.type(requirementsInput, "No");

          const submitStep1 = screen.getByRole("button", { name: /submit/i });
          await user.click(submitStep1);

          // Wait for Step 2
          await waitFor(
            () => {
              expect(screen.getByText(/Step 2 of 10/i)).toBeDefined();
            },
            { timeout: 10000 }
          );

          // ... (Continue through steps 3-6, similar to __integration.test.tsx)

          // Verify we reached Step 7
          await waitFor(
            () => {
              expect(screen.getByText(/Step 7 of 10/i)).toBeDefined();
            },
            { timeout: 10000 }
          );

          // ====================================================================
          // PHASE 2: Wait for database persistence (debounce)
          // ====================================================================
          await new Promise((resolve) => setTimeout(resolve, 1000));

          // ====================================================================
          // PHASE 3: Simulate page refresh (unmount + remount)
          // ====================================================================
          unmount();

          // Clear React state but keep localStorage (simulates refresh)
          const { unmount: unmount2 } = render(
            <PlanningMachineProvider
              input={{ projectId }}
              storageKey={`planning-machine-${projectId}`}
            >
              <TestWorkflow />
            </PlanningMachineProvider>
          );

          // ====================================================================
          // PHASE 4: Verify state preserved (not lost)
          // ====================================================================
          await waitFor(
            () => {
              // ✅ KEY ASSERTION: Still at Step 7 (not reverted to Step 1)
              expect(screen.getByText(/Step 7 of 10/i)).toBeDefined();
            },
            { timeout: 5000 }
          );

          // Verify completed steps preserved
