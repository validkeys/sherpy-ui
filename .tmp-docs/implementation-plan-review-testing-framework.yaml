      - Use documentation templates
      - Focus on API reference first
      - Defer examples to later tasks
      - OR: Increase estimate to 1.5h for comprehensive docs
    best_practice_ref: "task-sizing.md: Minimum 30 minutes with rationale"

  - id: INFO-003
    category: testing
    severity: medium
    task: "Task 1.8: Add Database Persistence Methods"
    issue: "Test database setup mentioned but not detailed"
    impact: "Developer may struggle with test environment setup"
    recommendation: |
      Add explicit test database setup instructions:
      - Document test DB connection string
      - Include docker-compose.test.yml if needed
      - Add seed data scripts
      - Document cleanup strategy
    best_practice_ref: "TDD Requirements: Test environment must be clear"

  - id: INFO-004
    category: drift_prevention
    severity: medium
    task: "All code tasks"
    issue: "Drift policy stated in plan but not in individual task instructions"
    impact: "Developer may not remember to stop on unexpected changes"
    recommendation: |
      Add drift policy reminder to each code task template:

      **Drift Policy:**
      STOP immediately if:
      - New dependencies needed (not in allowed list)
      - More than 3 unexpected files touched
      - Tests fail and you want to modify tests
      - Linting/type errors cannot be resolved

      Revert changes and document in docs/drift-incidents/
    best_practice_ref: "drift-policy.md: Stop & Revert Criteria"

  - id: INFO-005
    category: task_organization
    severity: medium
    task: "Phase structure"
    issue: "No explicit Milestone 0 for infrastructure setup"
    impact: "Infrastructure tasks scattered across phases"
    recommendation: |
      Consider adding explicit Milestone 0: Project Setup
