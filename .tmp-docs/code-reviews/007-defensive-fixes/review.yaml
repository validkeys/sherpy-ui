## Issue 2: VALIDATION LOGIC RELIES ON OBJECT.KEYS ORDER (MEDIUM)

**Severity:** 🟡 MEDIUM - Potential Bug
**File:** `src/features/planning/components/FormStep.tsx:89-92`

### Problem

```tsx
const filledFields = Object.keys(formData).filter(key => {
  const value = formData[key];
  return value && value.trim().length > 0;
});

if (filledFields.length < questions.length) {
  // Error
}
```

This checks that "number of filled fields >= number of questions" but doesn't verify the **right fields** are filled.

**Example Bug Scenario:**
```tsx
questions = [
  { id: 'existingRequirements', ... },
  { id: 'projectDescription', ... }
];

formData = {
  existingRequirements: 'Yes',
  randomExtraField: 'Some value',  // Extra field from localStorage corruption
  // projectDescription is MISSING
};

// filledFields.length = 2
// questions.length = 2
// ✅ Validation passes - BUT projectDescription is missing!
```

### Why This Could Happen

From BUG-007 report:
> "Server logs show formData: {} is empty and isFormValid: false, suggesting form state not properly captured"

If localStorage corruption adds **extra keys** to formData, the count-based validation fails.

### Recommended Fix

Validate **specific question IDs** instead of counting:

```tsx
// Check that ALL required question IDs have values
const missingFields = questions.filter(q => {
  const value = formData[q.id];
  return !value || value.trim().length === 0;
});

if (missingFields.length > 0) {
  console.error('[FormStep] ❌ DEFENSIVE CHECK FAILED: required fields missing', {
    formData,
    missingFields: missingFields.map(q => q.id),
    stepNumber,
  });
  return;
}
```

**Benefits:**
- Validates exact fields required
- Works even if formData has extra keys
- Better error message showing which fields are missing

