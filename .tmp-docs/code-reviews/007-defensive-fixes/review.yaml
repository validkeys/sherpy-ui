## Issue 3: LOCALSTORAGE VALIDATION IS TOO LENIENT (LOW)

**Severity:** 🟢 LOW - Enhancement
**File:** `src/features/planning/machines/PlanningMachineContext.tsx:164-167`

### Current Code

```tsx
// Validate parsed state has required structure
if (!parsed.context || !parsed.value) {
  throw new Error('Invalid state structure: missing context or value');
}
```

### Problem

This only checks that `context` and `value` **exist**, not that they're valid. Examples that would pass:

```tsx
{ context: null, value: {} }           // context is falsy but exists
{ context: {}, value: "invalid" }      // value is wrong type
{ context: {}, value: {} }             // Missing projectId, steps, etc.
```

### Recommended Enhancement

Add deeper validation:

```tsx
// Validate parsed state has required structure
if (!parsed.context || !parsed.value || typeof parsed.context !== 'object') {
  throw new Error('Invalid state structure: missing or invalid context/value');
}

// Validate critical context fields
if (!parsed.context.projectId || !parsed.context.currentStepNumber) {
  console.warn('[PlanningMachineContext] ⚠️  State missing critical fields, clearing');
  throw new Error('Invalid state structure: missing projectId or currentStepNumber');
}
```

**Why LOW severity:** XState will likely reject invalid state anyway, making this validation redundant. Current check is sufficient for catching JSON corruption.

