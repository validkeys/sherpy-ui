review:
  milestone: m2
  date: "2026-05-06"
  reviewer: Claude Sonnet 4.6

checklist:
  step_state_architecture:
    server_fn_sole_source_of_truth: pass
    lazy_init_new_projects: pass
    lazy_init_returning_projects: pass
    submit_answer_side_effects_clean: fail  # out-of-order submit regresses currentStep
  thread_ui:
    history_renders_completed_steps: pass
    current_step_card_design_system: pass  # border-emph + shadow via ThreadView
    composer_submit_triggers_mutation: pass
    query_invalidation_refreshes_thread: pass
  routing:
    project_id_defaults_to_build: pass
    mode_toggle_navigates_build_review: pass
  tests:
    step_store_covered: pass
    server_validator_covered: pass
    interview_thread_history_and_current: pass
    project_intake_gate_logic: pass

findings:
  - id: m2-r001
    severity: bug
    file: src/features/planning/store.ts
    lines: "119-121"
    summary: >
      submitAnswer advances currentStep to stepNumber+1 with no guard that
      stepNumber === state.currentStep. Submitting an old step (e.g. step 3
      when currentStep is 5) regresses currentStep to 4.
    fix: >
      Add early guard: if (stepNumber !== state.currentStep) return state.

  - id: m2-r002
    severity: risk
    file: src/features/planning/server.ts
    line: 34
    summary: >
      $submitAnswer handler skips await initStore() that $getStepState calls.
      Hot-reload wiping server memory between calls causes "No step state"
      instead of recovery.
    fix: Add await initStore() before the submitAnswer store call.

  - id: m2-r003
    severity: risk
    file: src/features/planning/components/InterviewThread.tsx
    lines: "103-107"
    summary: >
      value={selectedOption ? "" : inputText} makes input appear blank when
      option selected. Loses caret position and shows no visual indication of
      which option is active beyond placeholder text.
    fix: Show option title as input value instead of empty string.

  - id: m2-r004
    severity: risk
    file: src/features/planning/server.test.ts
    lines: "65-72"
    summary: >
      Test titled "lazy-inits step state and returns 10 steps" manually calls
      initProjectSteps — does not exercise the lazy-init branch in $getStepState
      handler. Actual lazy-init logic is untested.
    fix: >
      Retitle to "returns 10 steps when already initialized". Add separate test
      verifying hasStepState is false before getStepState throws.

  - id: m2-r005
    severity: risk
    file: src/features/planning/components/InterviewThread.test.tsx
    summary: >
      Option card click → submit path is untested. selectedOption ?? inputText
      branch only exercised via inputText in tests.
    fix: Add test: click OptionCard, verify mockMutate called with option letter.

  - id: m2-r006
    severity: nit
    file: src/features/planning/components/InterviewThread.test.tsx
    summary: >
      queryByText(/✓/) is fragile — breaks if any other component renders a
      checkmark.
    fix: Query by role or data-testid on ThreadDivider instead.

  - id: m2-r007
    severity: nit
    file: src/features/planning/components/InterviewThread.tsx
    line: 90
    summary: Submit button has no aria-label. Screen reader hears "…" during pending.
    fix: Add aria-label="Submit answer" to the button.

  - id: m2-r008
    severity: nit
    file: src/features/planning/components/ProjectIntake.tsx
    lines: "37-38"
    summary: >
      onClick={() => !isPending && handleSelect(...)} guard invisible to
      assistive tech. PathCard has no disabled prop.
    fix: Add aria-disabled={isPending} wrapper or extend PathCard with disabled in M3.

  - id: m2-r009
    severity: nit
    file: src/features/planning/store.ts
    lines: "60-75"
    summary: Triple-nested inline ternary for step status is dense.
    fix: Extract to getInitialStatus(i, entryPath) helper.

  - id: m2-r010
    severity: known-placeholder
    file: src/features/planning/components/AnsweredMessage.tsx
    line: 13
    summary: Hardcoded "KW" initials.
    fix: Wire to user session in M4 when auth lands.

action_items:
  must_fix_before_m3:
    - m2-r001  # bug: out-of-order submit
    - m2-r002  # risk: missing initStore in $submitAnswer
  should_fix:
    - m2-r003
    - m2-r004
    - m2-r005
  defer:
    - m2-r006
    - m2-r007
    - m2-r008
    - m2-r009
    - m2-r010
