summary: |
  This is a well-structured, thoughtful implementation plan for migrating from text parsing
  to JSON Schema structured output. The plan demonstrates strong architectural thinking,
  comprehensive risk mitigation, and careful attention to backward compatibility.

  The plan excels in clarity, task decomposition, and phased rollout strategy. The use of
  feature flags for gradual migration is excellent engineering practice. Style anchors are
  concrete and well-chosen.

  Areas for improvement include: adding TDD checklists to more tasks, clarifying some
  drift policies, and adding more explicit validation commands for integration testing.

  **Recommendation:** READY FOR DEVELOPMENT with minor refinements suggested below.

critical_issues: []

high_priority_issues:
  - id: WARN-001
    severity: high
    category: tdd_requirements
    title: "TDD checklists missing from most code tasks"
    description: |
      Only t-struct-001 and t-struct-003 explicitly mention creating tests. Tasks t-struct-004
      through t-struct-008 modify critical code paths but don't include TDD checklists requiring
      tests-first approach.
    location:
      - tasks: ["t-struct-004", "t-struct-005", "t-struct-006", "t-struct-007", "t-struct-008"]
    impact: |
      Without TDD guidance, implementation might skip test coverage or write tests after code,
      reducing test quality and missing edge cases.
    recommendation: |
      Add TDD checklists to each code task:

      ```yaml
      tdd_checklist:
        - [ ] Write failing test for JSON response parsing
        - [ ] Implement minimal code to pass test
        - [ ] Add tests for edge cases (invalid JSON, missing fields)
        - [ ] Refactor for clarity while keeping tests green
        - [ ] Run validation: npm test <specific-file>.test.ts
      ```

  - id: WARN-002
    severity: high
    category: drift_policy
    title: "Drift policy not explicitly stated in all task instructions"
    description: |
      Tasks mention "CRITICAL CONSTRAINTS" and "Touch ONLY" but don't include explicit drift
      policy with stop criteria and revert instructions in the task instructions section.
    location:
      - tasks: ["t-struct-001", "t-struct-002", "t-struct-003", "t-struct-004", "t-struct-005", "t-struct-006", "t-struct-007", "t-struct-008"]
    impact: |
      Without explicit drift policy, implementer might not know when to stop and revert,
      potentially introducing scope creep or unexpected dependencies.
    recommendation: |
      Add drift policy section to each task's instructions:

      ```
      ## DRIFT POLICY
      STOP and revert immediately if:
      - New dependencies introduced (not in allowed list)
      - Files touched outside specified targets
      - Linting/type errors cannot be resolved within task scope
      - Tests fail and you consider modifying tests instead of implementation

      If drift occurs:
      1. STOP immediately
      2. Revert changes: git checkout <files>
      3. Document in docs/drift-incidents/
      4. Report issue before proceeding
      ```

  - id: WARN-003
    severity: high
    category: validation
    title: "Integration testing plan lacks executable commands"
    description: |
      The validation.integration_tests section lists manual tests but doesn't provide
      executable commands or scripts. "Manual test: Step 1 with USE_STRUCTURED_OUTPUT=true"
      is not actionable without specific steps.
    location:
      - section: "validation.integration_tests"
    impact: |
      Manual tests without clear steps are often skipped or executed inconsistently,
      reducing confidence in the implementation.
    recommendation: |
      Create integration test script or provide explicit steps:

      ```bash
      # scripts/test-structured-output-integration.sh

      # Test Phase 1: Step 1 only
      USE_STRUCTURED_OUTPUT=true STRUCTURED_OUTPUT_STEPS=1 npm run dev &
      PID=$!
      sleep 5

      # Open browser and navigate to Step 1
      # Verify: Options render as cards (not text)
      # Verify: Question text clean (no **Options:** section)
      # Verify: isComplete works

      kill $PID
      ```

      Or add to t-struct-009 as automated integration tests using Playwright/Cypress.

medium_priority_issues:
  - id: INFO-001
    severity: medium
    category: task_sizing
    title: "t-struct-009 is at upper limit (120 minutes)"
    description: |
      t-struct-009 "Add comprehensive tests" is estimated at 120 minutes, which is near
      the 150-minute maximum. The task creates one new file and modifies two existing
      test files, which could be split for better isolation.
    location:
      - task: "t-struct-009"
    impact: |
      Large test tasks are harder to review and may take longer than estimated if edge
      cases are discovered during implementation.
    recommendation: |
      Consider splitting into two tasks:
      - t-struct-009a: "Create structured-output.test.ts" (60 min)
      - t-struct-009b: "Update hooks.test.ts and streaming.test.ts" (60 min)

      This provides a natural checkpoint and makes the work more reviewable.

  - id: INFO-002
    severity: medium
    category: style_anchors
    title: "Test style anchors could be more explicit"
    description: |
      While style anchors reference test files (e.g., "src/features/ai/server.test.ts:90-120"),
      they could be more specific about test patterns like mocking strategies, assertion
      patterns, and test structure.
    location:
      - style_anchors: ["src/features/ai/server.test.ts"]
    impact: |
      New tests might not follow existing testing patterns for Bedrock mocks, TextEncoder
      usage, or error handling.
    recommendation: |
      Add test-specific style anchor with pattern description:

      ```yaml
      - path: "src/features/ai/server.test.ts"
        lines: "90-120"
        pattern: "Mocking Bedrock with TextEncoder/Decoder for JSON responses"
        notes: "Use vi.mock for bedrockClient.send, wrap JSON in TextEncoder"
      ```

  - id: INFO-003
    severity: medium
    category: affirmative_instructions
    title: "Some tasks use negative framing"
    description: |
      Task instructions occasionally use "DO NOT" or "MUST NOT" phrasing instead of
      affirmative "ONLY use" or "MUST" phrasing.
    location:
      - tasks: ["t-struct-007"]
      - example: "Remove onOptionsReady callback" could be "Use hook result for options"
    impact: |
      Negative framing is harder to follow and more prone to misinterpretation than
      affirmative instructions.
    recommendation: |
      Reframe negative instructions positively:
      - "DO NOT add new dependencies" → "ONLY use: @aws-sdk/client-bedrock-runtime"
      - "Remove X" → "Use Y instead of X"
      - "MUST NOT modify tests" → "MUST fix implementation to pass existing tests"

  - id: INFO-004
    severity: medium
    category: dependencies
    title: "Task dependency graph could show parallel opportunities"
    description: |
      Tasks are sequenced linearly, but some could run in parallel to reduce total time.
      For example, t-struct-003 (feature flags) doesn't depend on t-struct-001 or t-struct-002.
    location:
      - tasks: ["t-struct-003"]
    impact: |
      Linear sequencing adds unnecessary time. Total duration could be reduced from 10-12
      hours to 8-10 hours with parallelization.
    recommendation: |
      Identify parallel work streams:

      **Phase 1 (parallel):**
      - Stream A: t-struct-001 → t-struct-002 (schemas + step config)
      - Stream B: t-struct-003 (feature flags, independent)

      **Phase 2 (parallel after Phase 1):**
      - Stream A: t-struct-004 (streaming)
      - Stream B: t-struct-005 (non-streaming)

      Document this in migration_strategy with time savings estimate.

  - id: INFO-005
    severity: medium
    category: quality_gates
    title: "Pre-commit hooks not specified"
    description: |
      The plan mentions "Pre-commit hooks" in quality gates but doesn't specify what
      hooks should run (lint, typecheck, tests) or how to configure them.
    location:
      - section: "validation.quality_gates"
    impact: |
      Without explicit pre-commit configuration, drift might not be caught until CI runs.
    recommendation: |
      Add task or section specifying pre-commit configuration:

      ```yaml
      # .husky/pre-commit or package.json
      "lint-staged": {
        "*.ts": ["npm run lint:fix", "npm run typecheck"],
        "*.tsx": ["npm run lint:fix", "npm run typecheck"]
      }
      ```

      Or add to t-struct-010 (rollout) as part of setup.

