      ## Schema Requirements

      Define 3 schemas:

      1. INTERVIEW_QUESTION_SCHEMA
         - question: string (question text WITHOUT options section)
         - options: array of StepOption (letter, title, body, recommended)
         - isComplete: boolean (replaces [STEP_COMPLETE] marker)

      2. ARTIFACT_RESPONSE_SCHEMA
         - content: string (generated YAML or markdown)
         - format: "yaml" | "markdown"

      3. REFINEMENT_RESPONSE_SCHEMA
         - content: string (refined artifact content)

      ## Style Anchor
