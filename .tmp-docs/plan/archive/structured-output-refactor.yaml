risks:
  - risk: "AWS Bedrock JSON Schema support not available in our region"
    likelihood: low
    impact: high
    mitigation: "Test in dev environment first. If unavailable, use text mode with feature flag off."

  - risk: "LLM fails to adhere to schema (returns invalid JSON)"
    likelihood: low
    impact: medium
    mitigation: "Bedrock enforces schema at API level. Add fallback to text parsing on JSON parse errors."

  - risk: "Breaking changes to StepOption interface"
    likelihood: low
    impact: high
    mitigation: "JSON Schema must match existing interface exactly. Tests enforce this."

  - risk: "Gradual rollout causes user confusion (some steps JSON, some text)"
    likelihood: medium
    impact: low
    mitigation: "Rollout by step number. Document clearly. Monitor feedback."

success_criteria:
  - Zero duplicate option text in UI
  - Question text clean (no **Options:** section)
  - parse-options.ts deprecated (can be deleted after full rollout)
  - Type-safe responses from LLM
  - Feature flag enables gradual rollout
  - All tests passing
  - Documentation complete

notes: |
  This refactor moves from brittle text parsing to enterprise-grade structured output.
  The AWS Bedrock response_format parameter guarantees JSON Schema compliance, eliminating
  the need for complex regex parsing. The gradual rollout via feature flags ensures zero
  downtime and easy rollback if issues arise.

  Key architectural decision: Keep parse-options.ts during rollout for backward compatibility.
  Once all steps use structured output (Phase 3), we can safely delete it.

  This approach follows best practices:
  - Configuration-driven (schemas in step-config)
  - Type-safe (TypeScript types match JSON schemas)
  - Testable (mock JSON responses)
  - Observable (Langfuse tracking preserved)
  - Reversible (feature flag rollback)
