overview:
  problem: |
    Current implementation parses unstructured text from LLM responses, which is brittle:
    - Question text includes **Options:** section causing UI duplication
    - Text parsing has 25 test cases to handle edge cases (complex maintenance)
    - [STEP_COMPLETE] signal is string-based, not type-safe
    - No compile-time guarantees on response structure
    - Parser logic (parse-options.ts) must handle AI variability

  solution: |
    Leverage AWS Bedrock's JSON Schema response format constraint (available in Claude 3.5+)
    to guarantee structured, type-safe responses from the LLM. Define response schemas in
    step-config.ts alongside step definitions, pass to Bedrock API, receive validated JSON.

  benefits:
    - Type safety: TypeScript interfaces match JSON schemas exactly
    - Zero parsing: Direct deserialization from JSON
    - Simpler code: Delete parse-options.ts entirely (~150 LOC)
    - Better UX: Clean separation of question text vs. options
    - Enterprise-grade: Configuration-driven, self-documenting contracts
    - Maintainable: Schema changes are explicit, versioned

  constraints:
    technical:
      - Must maintain backward compatibility during rollout (support text + JSON responses)
      - AWS Bedrock SDK 3.1044.0+ supports response_format parameter
      - Claude 3.5+ models support JSON Schema constraints
      - Existing Langfuse observability must continue working
    business:
      - Zero downtime migration (feature flag for gradual rollout)
      - All 159 existing tests must pass
      - No breaking changes to StepOption interface
    timeline:
      - Complete in 1-2 sprints (8-12 hours)
      - Rollout Phase 1: Interview steps (Steps 1-3)
      - Rollout Phase 2: Artifact generation (Steps 2, 3)

architecture:
  components:
    - name: "Response Schemas"
      location: "src/features/planning/response-schemas.ts"
      purpose: "JSON Schema definitions for each step type (interview, artifact, refinement)"

    - name: "Step Config Extension"
      location: "src/features/planning/step-config.ts"
      purpose: "Add responseSchema field to StepConfig interface"

    - name: "Bedrock API Integration"
      location: "src/features/ai/server.ts, streaming.ts"
      purpose: "Pass response_format to InvokeModelCommand with schema"

    - name: "Response Parsing"
      location: "src/features/ai/hooks.ts"
      purpose: "Parse JSON instead of text, with fallback for backward compat"

    - name: "Feature Flag"
      location: "src/features/ai/feature-flags.ts (new)"
      purpose: "Toggle structured output per step for gradual rollout"

  data_flow: |
    1. User submits answer → InterviewThread.tsx
    2. submitAnswer mutation → planning/server.ts
    3. Server builds prompt → ai/prompts.ts with step config
    4. Get responseSchema from step-config.ts
    5. Call Bedrock with response_format: { type: "json_schema", schema: ... }
    6. Bedrock returns validated JSON matching schema
    7. Parse JSON to typed InterviewQuestionResponse
    8. Update UI with structured question + options (no parsing needed)

  migration_strategy:
    phase_1:
      name: "Add Schemas + Feature Flag"
      duration: "2-3 hours"
      tasks: ["t-struct-001", "t-struct-002", "t-struct-003"]

    phase_2:
      name: "Update Bedrock Integration"
      duration: "2-3 hours"
      tasks: ["t-struct-004", "t-struct-005"]

    phase_3:
      name: "Update Hooks + UI"
      duration: "2-3 hours"
      tasks: ["t-struct-006", "t-struct-007"]

    phase_4:
      name: "Testing + Rollout"
      duration: "2-3 hours"
      tasks: ["t-struct-008", "t-struct-009", "t-struct-010"]

