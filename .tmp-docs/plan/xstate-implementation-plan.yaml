plan:
  name: "XState v5 State Management Migration"
  version: "1.1"
  created: "2026-05-09"
  updated: "2026-05-09"
  estimated_duration_days: 7
  changes_from_v1_0: "Added performance optimization, accessibility, and error handling tasks based on React excellence review"

  context:
    branch: "feature/structured-output"
    base_branch: "main"
    proposal: ".tmp-docs/plan/xstate-proposal.md"
    current_architecture: "src/features/planning/components/InterviewThread.tsx (1500+ lines god component)"
    target_architecture: "XState v5 actor-based state machine with hierarchical states"

  constraints:
    dependencies:
      only_use:
        - "xstate@^5.31.0"
        - "@xstate/react@^5.0.0"
      no_additional: true

    files:
      preserve:
        - "src/features/planning/types.ts (extend, don't replace)"
        - "src/features/planning/step-config.ts (reference only)"
        - "src/features/ai/parse-options.ts (reuse as-is)"

      delete_after_migration:
        - "src/features/planning/hooks.ts (old useStreamingQuestion)"
        - "src/features/planning/components/InterviewThread.tsx"

    quality_gates:
      pre_commit:
        - "npm run lint -- --max-warnings 0"
        - "npm run typecheck"
        - "npm test -- --run"

      per_task:
        - "All existing tests still pass"
        - "New tests for new code"
        - "Type errors = 0"

    drift_policy:
      stop_immediately_if:
        - "Files outside task scope modified (>3 unexpected files)"
        - "Dependencies added beyond xstate + @xstate/react"
        - "Tests fail and AI suggests modifying tests"
        - "Type errors cannot be resolved in task scope"

      allowed_deviations:
        - "Formatting changes (prettier/eslint auto-fix)"
        - "Import reordering"
        - "Single-line type annotations within scope"

  style_anchors:
    - path: "src/features/planning/types.ts"
      lines: "1-50"
      pattern: "TypeScript discriminated unions for step types"
      rationale: "Use same pattern for XState context types"

    - path: "src/features/planning/components/InterviewThread.tsx"
      lines: "56-69"
      pattern: "React Query hook with mutation pattern"
      rationale: "Replace with XState useSelector pattern"

    - path: "src/features/ai/hooks.ts"
      lines: "38-141"
      pattern: "Promise-based async side effects with state management"
      rationale: "Replace with XState fromPromise actors and invoke"

