      instructions: |
        # Error Boundary Implementation

        CRITICAL CONSTRAINTS:
        - Create ONLY: StepErrorBoundary.tsx
        - Modify ONLY: StepContainer.tsx
        - Use class component (error boundaries must be classes)

        ## Create StepErrorBoundary.tsx

        ```typescript
        import React, { Component, type ReactNode } from 'react';

        interface Props {
          currentStep: string;
          children: ReactNode;
        }

        interface State {
          hasError: boolean;
          error: Error | null;
        }

        export class StepErrorBoundary extends Component<Props, State> {
          constructor(props: Props) {
            super(props);
            this.state = { hasError: false, error: null };
          }

          static getDerivedStateFromError(error: Error): State {
            return { hasError: true, error };
          }

          componentDidCatch(error: Error, errorInfo: React.ErrorInfo) {
            console.error('[StepErrorBoundary]', {
              currentStep: this.props.currentStep,
              error,
              errorInfo,
            });
            // TODO: Send to error monitoring service (Sentry, etc.)
          }

          handleReset = () => {
            this.setState({ hasError: false, error: null });
          };

          render() {
            if (this.state.hasError) {
              return (
                <div className="error-boundary" role="alert">
                  <h2>Something went wrong</h2>
                  <p>Error in step: {this.props.currentStep}</p>
                  <pre>{this.state.error?.message}</pre>
                  <button onClick={this.handleReset}>Try Again</button>
                  <a href="https://github.com/yourorg/repo/issues">Report Issue</a>
                </div>
              );
            }

            return this.props.children;
          }
        }
        ```

