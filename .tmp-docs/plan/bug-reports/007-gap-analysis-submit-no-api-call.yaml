  1. FormStep validation: Blocks submission if required fields missing
  2. localStorage recovery: Auto-clears corrupted state and starts fresh
  3. Deep validation: Checks projectId and currentStepNumber exist

  These changes prevent race conditions and localStorage corruption from causing
  invalid submissions or broken state.

