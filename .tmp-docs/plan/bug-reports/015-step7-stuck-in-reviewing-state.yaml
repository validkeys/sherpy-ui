notes: |
  This bug was discovered during Test Run #012 while validating the resolution
  of BUG-014 (form data capture). Steps 1-6 completed successfully, demonstrating
  that the primary test objective (form data capture validation) was achieved.

  However, the workflow became stuck at Step 7, preventing validation of the
  final three steps (8-10). This is a new issue not present in previous test runs.

  The bug's persistence across page refreshes (due to localStorage) suggests the
  issue is in the artifact generation logic or state machine transitions, not
  just a transient loading issue.

