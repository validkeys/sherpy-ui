# Description
summary: |
  The dashboard project cards show incorrect step information that doesn't match
  the actual project state. Projects display as being on Step 2 when they are
  actually on Step 1.

expected_behavior: |
  Dashboard project cards should display the current step that matches the actual
  project state. If a project is on Step 1 (Gap Analysis with empty form), the
  dashboard should show "Step 1 · Gap Analysis" or similar.

actual_behavior: |
  Dashboard shows "Step 2 · Business Goals" for billing-platform project (SHR-0002),
  but when navigating directly to /project/seed-0002/build, the page displays
  Step 1 (Gap Analysis) with empty form fields.

  Dashboard text: "Step 2 · Business Goals"
  Actual state: Step 1 - Gap Analysis (H2 heading: "Gap Analysis")

# Reproduction
steps_to_reproduce:
  - "Navigate to http://localhost:5180/dashboard"
  - "Observe billing-platform project card shows 'Step 2 · Business Goals'"
  - "Navigate directly to http://localhost:5180/project/seed-0002/build"
  - "Observe page heading shows 'Gap Analysis' (Step 1)"
  - "Note the mismatch between dashboard display and actual state"

