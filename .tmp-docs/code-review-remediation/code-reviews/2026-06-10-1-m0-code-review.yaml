# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ARCHITECTURE REVIEW
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

architecture:
  pattern: "Dependency Injection via Factory Function"

  before:
    description: "Dynamic imports in actor implementations"
    issues:
      - "~5-20ms async import latency per actor invocation"
      - "No compile-time type checking across async import boundary"
      - "Harder to test (must mock module system)"
      - "Limited tree-shaking (dynamic imports create async boundaries)"

    code_example: |
      // Inside fetchQuestion actor (original)
      const { $generateQuestion } = await import("../../ai/server");
      const result = await $generateQuestion({ data: {...} });

  after:
    description: "Static imports with factory-injected dependencies"
    benefits:
      - "Zero runtime import overhead (functions pre-resolved)"
      - "Full compile-time type checking"
      - "Easy testing (inject mocks at machine creation)"
      - "Better tree-shaking and bundle optimization"
      - "Explicit dependencies (clear architecture)"

    code_example: |
      // PlanningMachineContext.tsx (production)
      import { createPlanningMachine } from './planning-machine-factory';
      import { $generateQuestion, $assessGapAnalysisNeed, $generateArtifact } from '../../ai/server';
      import { parseOptions } from '../../ai/parse-options';

      const planningMachine = createPlanningMachine({
        $generateQuestion,
        $assessGapAnalysisNeed,
        $generateArtifact,
        parseOptions,
      });

  design_quality:
    separation_of_concerns: excellent
    testability: excellent
    maintainability: excellent
    type_safety: excellent
    performance: improved

  notes: |
    Factory pattern is a well-established solution for dependency injection.
    Implementation follows XState v5 best practices while maintaining clean
    separation between machine definition (factory) and machine usage (context).

