          function BuildComponent() {
            const { projectId } = Route.useParams();
            const [project, setProject] = useState<Project | null>(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
              fetch(`/api/projects/${projectId}`)
                .then(res => res.json())
                .then(data => {
                  setProject(data);
                  setLoading(false);
                })
                .catch(err => {
                  console.error('Failed to load project:', err);
                  setLoading(false);
                });
            }, [projectId]);

            if (loading) return <div>Loading...</div>;
            if (!project) return <div>Project not found</div>;

            return (
              <PlanningMachineProvider
                input={{ projectId, entryPath: project.entryPath }}
                initialStep={project.currentStep}
                storageKey={`planning-machine-${projectId}`}
              >
                <InspectorLogger />
                <Navigation />
                <StepContainer />
              </PlanningMachineProvider>
            );
          }
          ```

          2. In PlanningMachineContext.tsx, add initialStep:
          ```typescript
          type PlanningMachineProviderProps = {
            children: ReactNode;
            input: PlanningInput;
            initialStep: number; // NEW
            storageKey?: string;
          };

          export function PlanningMachineProvider({
            children,
            input,
            initialStep,
            storageKey = 'planning-machine-state',
          }: PlanningMachineProviderProps) {
            const [actor] = React.useState(() => {
              const persistedState = loadState(storageKey);

              if (persistedState && persistedState.context.projectId === input.projectId) {
                const localStep = persistedState.context.currentStepNumber;

                if (localStep !== initialStep) {
                  console.warn(
                    `[Planning Machine] Conflict: backend=${initialStep}, local=${localStep}. Using backend.`
                  );
                }

                persistedState.context.currentStepNumber = initialStep;
              }

              return createActor(planningMachine, {
                input,
                snapshot: persistedState,
              });
            });

            // ... rest unchanged
          }
          ```

