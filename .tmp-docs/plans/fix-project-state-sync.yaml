# Implementation Plan: Fix Project State Synchronization
# Bug #002: Dashboard and Build Page Show Different Steps

metadata:
  plan_id: fix-state-sync-001
  created: 2026-05-13
  status: ready
  estimated_duration: 2-3 days
  bug_report: .tmp-docs/plan/bug-reports/002-project-state-display-mismatch.yaml
  closes_bug: "002"

problem_statement: |
  Dashboard shows "Step 2" while build page shows "Step 1" for the same project.
  Root cause: Planning machine (localStorage) and backend (Project.currentStep)
  are two independent sources of truth with no synchronization.

  Original bug report: .tmp-docs/plan/bug-reports/002-project-state-display-mismatch.yaml

solution_approach: |
  Make backend the single source of truth:
  1. Planning machine syncs currentStep to backend on every transition
  2. Build page initializes planning machine from backend currentStep
  3. localStorage used only for draft answers (UI state), not step position
  4. Backend wins all conflicts

constraints:
  dependencies:
    only_use: [existing stack - no new dependencies needed]
  file_scope:
    touch_only:
      - app/api/projects.ts (new API endpoint)
      - src/features/projects/store.ts (add updateCurrentStep)
      - src/features/planning/machines/planningMachine.ts (add sync action)
      - app/routes/project/$projectId.build.tsx (initialize from backend)
      - src/features/planning/machines/PlanningMachineContext.tsx (conflict resolution)
  validation_gates:
    - npm run typecheck (zero errors)
    - npm test (all passing)
    - Manual test: complete step, refresh, verify consistency

style_anchors:
  - path: app/api/ai/interview.ts
    lines: 1-50
    pattern: vinxi/http defineEventHandler with validation and error handling
  - path: src/features/projects/store.ts
    lines: 33-46
    pattern: Store update functions with validation
  - path: src/features/planning/machines/planningMachine.ts
    lines: 237-242
