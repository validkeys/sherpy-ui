context: |
  BUG-007 reports that Gap Analysis submit button doesn't trigger API calls.
  Tests show current code works correctly, but the bug symptoms suggest:
  1. Race condition where formData becomes empty before submission
  2. Corrupted localStorage causing invalid initial state

  Solution: Add defensive checks to prevent invalid submissions and auto-recover
  from corrupted state.

goals:
  - Prevent form submission when formData is invalid (even if button enabled)
  - Auto-clear corrupted localStorage state and start fresh
  - Add logging to diagnose if bug recurs
  - Maintain all existing functionality

non_goals:
  - Changing core submission logic
  - Adding new features
  - Refactoring state management

tasks:
  - id: task-01
    title: Add defensive validation to FormStep handleSubmit
    file: src/features/planning/components/FormStep.tsx
    duration: 20min
    description: |
      Add validation check before sending SUBMIT_FORM event to catch race conditions
      where formData might be empty despite button being enabled.

    changes:
      - location: FormStep.tsx:84-100 (handleSubmit function)
        action: |
          Add defensive check at start of handleSubmit:

          ```tsx
          const handleSubmit = (e: React.FormEvent) => {
            e.preventDefault();

            // DEFENSIVE: Validate form data before submission
            // Protects against race conditions where formData is empty
            const filledFields = Object.keys(formData).filter(key => {
              const value = formData[key];
              return value && value.trim().length > 0;
            });

            if (filledFields.length < questions.length) {
              console.error('[FormStep] ❌ Cannot submit: form data incomplete', {
                formData,
                filledFields: filledFields.length,
                requiredFields: questions.length,
                isFormValid,
                stepNumber,
              });
              return; // Block submission
            }

            console.log('[FormStep] ===== SUBMIT CLICKED =====');
            // ... rest of existing logic
          ```

    verify: |
      - Run existing FormStep tests - all should pass
      - Add test case for empty formData submission attempt
      - Verify console.error is logged when validation fails
      - Verify no SUBMIT_FORM event is sent when validation fails

