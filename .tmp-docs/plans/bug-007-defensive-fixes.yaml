  - id: task-03
    title: Add localStorage recovery to PlanningMachineContext
    file: src/features/planning/machines/PlanningMachineContext.tsx
    duration: 15min
    description: |
      Wrap localStorage.getItem parsing in try-catch to auto-clear corrupted state.
      This prevents the entire app from breaking if stored state is invalid.

    changes:
      - location: PlanningMachineContext.tsx:154-171 (loadState function)
        action: |
          Update loadState function to handle corruption:

          ```tsx
          function loadState(key: string): SnapshotType | null {
            // Skip during SSR
            if (typeof window === 'undefined') return null;

            try {
              const stored = localStorage.getItem(key);
              if (!stored) return null;

              const parsed = JSON.parse(stored) as PersistedSnapshot;

              // Validate parsed state has required structure
              if (!parsed.context || !parsed.value) {
                throw new Error('Invalid state structure: missing context or value');
              }

              // Cast to unknown first, then to SnapshotType
              return parsed as unknown as SnapshotType;
            } catch (error) {
              // Auto-recover by clearing corrupted state
              console.error('[PlanningMachineContext] ⚠️  Corrupted state detected, clearing and starting fresh:', error);
              try {
                localStorage.removeItem(key);
              } catch (clearError) {
                console.error('[PlanningMachineContext] Failed to clear corrupted state:', clearError);
              }
              return null; // Start with fresh state
            }
          }
          ```

    verify: |
      - Manually corrupt localStorage and verify recovery
      - Check console.error is logged with diagnostic info
      - Verify app starts fresh after corruption
      - Run all PlanningMachineContext tests

  - id: task-04
    title: Add test for localStorage corruption recovery
    file: src/features/planning/machines/PlanningMachineContext.test.tsx
    duration: 10min
    description: |
      Add test that verifies corrupted localStorage is cleared and app recovers.

    changes:
      - location: Create new test or add to existing test suite
        action: |
          Add test case:

          ```tsx
          it('recovers from corrupted localStorage state', () => {
            const consoleSpy = vi.spyOn(console, 'error').mockImplementation();

            // Setup corrupted localStorage
            const mockLocalStorage = {
              getItem: vi.fn().mockReturnValue('{"invalid": "json"'), // Malformed JSON
              setItem: vi.fn(),
              removeItem: vi.fn(),
              clear: vi.fn(),
            };
            Object.defineProperty(window, 'localStorage', {
              value: mockLocalStorage,
              writable: true,
            });

            render(
              <PlanningMachineProvider input={defaultInput} storageKey="test-corrupted">
                <div>Test component</div>
              </PlanningMachineProvider>
            );

            // Verify error was logged
            expect(consoleSpy).toHaveBeenCalledWith(
              expect.stringContaining('Corrupted state detected'),
              expect.any(Error)
            );

            // Verify localStorage.removeItem was called
            expect(mockLocalStorage.removeItem).toHaveBeenCalledWith('test-corrupted');

            consoleSpy.mockRestore();
          });
          ```

    verify: |
      - Test passes
      - Console error shows corruption detected
      - localStorage.removeItem is called
      - App continues to function normally

