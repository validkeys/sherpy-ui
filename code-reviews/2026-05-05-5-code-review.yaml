checklist:
  security:
    - item: No AWS credentials in source — only env vars and default credential chain
      status: PASS
      notes: BedrockRuntimeClient uses process.env.AWS_REGION with default credential chain
    - item: No model ID hardcoded in source
      status: PASS
      notes: Uses process.env.BEDROCK_MODEL_ID with fallback default
    - item: Bedrock API errors caught and returned as safe error messages
      status: PASS
      notes: streaming.ts wraps iteration in try-catch, calls controller.error()
    - item: User input not injected into prompts without sanitization
      status: PASS
      notes: All prompts use structured message arrays, no string concatenation
    - item: All server fn validators use runtime type checks
      status: PASS
      notes: All validators check typeof before casting to Record<string, unknown>

  streaming:
    - item: Stream cleanup prevents state updates after unmount
      status: PASS
      notes: useStreamingQuestion uses cancelled flag in cleanup function (hooks.ts:64)
    - item: Content-Type text/event-stream set on streaming response
      status: PASS
      notes: app/api/ai/interview.ts sets proper headers (lines 38-40)
    - item: Client reader released on completion
      status: PASS
      notes: reader.read() loop properly exits on done=true (hooks.ts:50)

  auth:
    - item: Session shape matches Okta OIDC token structure
      status: NOT_APPLICABLE
      notes: Auth integration deferred to future milestone
    - item: AuthProvider wraps all routes requiring session
      status: NOT_APPLICABLE
      notes: Auth integration deferred to future milestone

  error_handling:
    - item: Bedrock rate-limit errors surfaced to UI as friendly message
      status: PASS
      notes: useStreamingQuestion sets error state on fetch failure (hooks.ts:58)
    - item: Network errors during streaming handled gracefully
      status: PASS
      notes: Try-catch in streamQuestion propagates via controller.error() (streaming.ts:40)

  artifact_generation:
    - item: Artifact stored before $submitAnswer returns
      status: PASS
      notes: generateArtifact calls upsertArtifact before returning (ai/server.ts:100)
    - item: Duplicate artifact keys overwrite (upsert) correctly
      status: PASS
      notes: upsertArtifact uses Map.set which overwrites (artifacts/store.ts:26)

  artifact_editing:
    - item: $updateArtifact throws on unknown key
      status: PASS
      notes: Checks getArtifact() result, throws if not found (artifacts/server.ts:64)
    - item: Edit → Cancel discards changes without mutation
      status: PASS
      notes: handleCancel only sets state, no mutation called (ArtifactBrowser.tsx:88-91)
    - item: Edit and Refine buttons disabled while operation in flight
      status: PASS
      notes: Composer disabled when isPending or isStreaming (InterviewThread.tsx:154)

  ai_refinement:
    - item: $refineArtifact validates instruction is non-empty
      status: PASS
      notes: Validator checks instruction.trim() length (ai/server.ts:137)
    - item: buildRefinementPrompt keeps content separate from instruction
      status: PASS
      notes: Structured message format with clear separation (ai/prompts.ts:95-99)
    - item: Refined content overwrites existing artifact
      status: PASS
      notes: Creates updated object and calls upsertArtifact (ai/server.ts:149)

