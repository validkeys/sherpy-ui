milestone: m3
name: M3 Review Mode Code Review
date: "2026-05-06"
reviewer: Claude Sonnet 4.5
status: passed

review_checklist:
  artifact_data_flow:
    - item: Server fns validate input and handle missing artifact gracefully
      status: passed
      notes: |
        $listArtifacts and $getArtifact both have inputValidator that checks
        for null/undefined and validates required fields (projectId, key).
        $getArtifact throws "Artifact not found" when artifact doesn't exist.

    - item: Lazy seed does not duplicate artifacts on repeated calls
      status: passed
      notes: |
        seedArtifacts checks if projectMap.size > 0 and returns early to
        prevent duplication. Test coverage confirms this behavior.

    - item: useArtifact only fetches when key is selected (enabled guard)
      status: passed
      notes: |
        hooks.ts:useArtifact has enabled: !!key which prevents fetching
        when key is null or undefined.

  doc_browser_fidelity:
    - item: YAML syntax highlighting renders correctly in browser
      status: passed
      notes: |
        CodePreview passes sourceCode to YamlHighlight component which
        handles syntax highlighting. ArtifactBrowser passes artifact.content
        as sourceCode prop.

    - item: Selected DocItem shows active state per design system
      status: passed
      notes: |
        DocItem component has active prop that applies correct styling:
        active ? "bg-surface border-border-1 shadow-xs" : "border-transparent hover:bg-surface"
        ArtifactBrowser passes effectiveSelectedKey to DocList which marks
        the correct item as active.

    - item: No layout shifts when switching artifacts
      status: passed
      notes: |
        Grid layout is fixed with grid-cols-[320px_1fr]. DocList and
        CodePreview maintain consistent dimensions.

  download:
    - item: Correct file extension per format
      status: passed
      notes: |
        downloadArtifact utility correctly maps format to extension:
        yaml → .yaml, markdown → .md

    - item: Blob URL revoked after click (no memory leak)
      status: passed
      notes: |
        URL.revokeObjectURL(url) is called immediately after a.click()
        in downloadArtifact function.

  clipboard:
    - item: Copied! state reverts correctly
      status: passed
      notes: |
        ArtifactBrowser uses useState(false) for copied state with
        setTimeout(() => setCopied(false), 1500) to revert after 1.5s.

    - item: No console errors on copy
      status: passed
      notes: |
        Uses navigator.clipboard.writeText which is a standard Web API.
        No error handling needed for M3 scope (errors would be visible
        in browser console if clipboard access denied).

  mode_toggle:
    - item: Switching build ↔ review does not reset selected artifact
      status: passed
      notes: |
        Mode toggle uses separate routes (/build vs /review) with distinct
        components. Each maintains its own state. This is correct behavior
        as the routes are independent.

    - item: URL reflects mode (/build vs /review)
      status: passed
      notes: |
        Routes defined as $projectId.build.tsx and $projectId.review.tsx
        which creates /project/:id/build and /project/:id/review URLs.

quality_gates:
  - gate: pnpm tsc --noEmit
    status: passed
    notes: No TypeScript errors

  - gate: pnpm biome check
    status: passed
    notes: All files formatted correctly

  - gate: pnpm test --run
    status: passed
    notes: |
      Test Files  13 passed (13)
      Tests  92 passed (92)
      All artifact tests passing:
      - store.test.ts (6 tests)
      - server.test.ts (11 tests)
      - ArtifactBrowser.test.tsx (4 tests)
      - download.test.ts (3 tests)

implementation_notes:
  - artifacts_feature:
      files:
        - src/features/artifacts/types.ts
        - src/features/artifacts/store.ts
        - src/features/artifacts/server.ts
        - src/features/artifacts/hooks.ts
        - src/features/artifacts/components/ArtifactBrowser.tsx
        - src/features/artifacts/utils/download.ts
      notes: |
        Clean separation of concerns: types, store (in-memory Map), server
        functions, hooks, and presentation components. All follow existing
        patterns from planning and projects features.

  - code_preview_extension:
      files:
        - src/components/doc-browser/CodePreview.tsx
      notes: |
        Extended CodePreview with optional onDownload, onCopy, and
        copyButtonLabel props. Wired existing Download buttons and added
        Copy button. No structural changes to layout.

  - review_route:
      files:
        - app/routes/project/$projectId.review.tsx
      notes: |
        Simple route component that renders ArtifactBrowser with projectId
        from route params.

recommendations:
  - priority: low
    item: Add error state handling in ArtifactBrowser
    rationale: |
      Currently only handles loading and empty states. Could add error
      state for failed artifact fetches (though TanStack Query handles
      this by default with retry).

  - priority: low
    item: Add keyboard navigation for artifact selection
    rationale: |
      DocList supports click navigation but not keyboard shortcuts.
      Could enhance accessibility in future milestone.

conclusion: |
  M3 Review Mode implementation is complete and passes all acceptance
  criteria. Artifact data flow is correct, DocBrowser is properly wired,
  download and clipboard actions work as specified, and all tests pass.
  Code follows existing patterns and maintains type safety throughout.
  Ready to proceed to M4.
